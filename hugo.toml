baseURL = "https://agca.studio/"
title = "agca·studio"
defaultContentLanguage = "tr"
defaultContentLanguageInSubdir = false
timeZone = "Europe/Istanbul"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]
capitalizeListTitles = false

[languages]
  [languages.tr]
    label = "Türkçe"
    locale = "tr"
    contentDir = "content/tr"
    weight = 1
    [languages.tr.params]
      siteDescription = "agca·studio, İstanbul merkezli bir mimarlık stüdyosu. Kentsel dönüşüm, Revit ile mimari projelendirme, görselleştirme ve sanal tur."
      city = "İstanbul"
  [languages.en]
    label = "English"
    locale = "en"
    contentDir = "content/en"
    weight = 2
    [languages.en.params]
      siteDescription = "agca·studio is an architecture studio based in Istanbul. Urban regeneration, architectural design in Revit, visualisation and virtual tours."
      city = "Istanbul"

[params]
  brand = "agca·studio"
  accent = "#F4A888"
  email = "info@agca.studio"
  phone = ""                         # telefon sitede gösterilmiyor (kullanıcı kararı); WhatsApp kullanılıyor
  whatsapp = "905380276283"          # wa.me bağlantısı için ülke kodlu, boşluksuz; boşsa gösterilmez
  instagram = "https://www.instagram.com/agcastudio/"
  linkedin = "https://www.linkedin.com/company/agca-%E2%80%A2-studio/"
  mapLink = "https://www.google.com/maps/search/?api=1&query=%C3%9Csk%C3%BCdar%2C+%C4%B0stanbul"  # harita görselinin bağlantısı; tam adres gelince güncellenir
  city = "İstanbul"
  district = "Üsküdar"
  cfAnalyticsToken = "5271f33c6aa343309fbfc6843c1c732e" # Cloudflare Web Analytics — çerezsiz, boşsa betik yüklenmez
  ogImage = "img/og-default.jpg"
  indexnowKey = "61519148285613e6e8c936fddbbb6411"  # static/<key>.txt dosyasıyla eşleşir

[imaging]
  resampleFilter = "Lanczos"
  anchor = "Smart"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 82
  [imaging.exif]
    disableDate = true
    disableLatLong = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[minify]
  minifyOutput = true

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
