<script>
'use strict';
// ---------- today: hero (game card), quests in swipeable panes, water, food log, cycle ----------
const EMOJI = { run: '🏃', k: '🍳', a1: '🍎', o: '🥗', a2: '🥛', ak: '🍲', walkNoon: '🚶', walkEve: '🌙', vinegar: '🍶', strength: '💪', weigh: '⚖️', sleep: '😴' };
const ICON = {
  su: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  ogun: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  hareket: '<path d="M22 12h-2.5a2 2 0 0 0-1.9 1.5l-2.4 8.3a.25.25 0 0 1-.5 0L9.2 2.2a.25.25 0 0 0-.5 0L6.4 10.5A2 2 0 0 1 4.5 12H2"/>',
  uyku: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',

};
function svgIcon(name) { return '<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICON[name] + '</svg>'; }

function levelName(n) { for (const l of LEVELS) if (n >= l[0]) return l[1]; return 'Çaylak'; }
function greeting() { const h = Number(nowHM().slice(0, 2)); return h < 5 ? 'İyi geceler' : h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar'; }
function recipeLinks(dow, mealKey, meal) {

  const html = ids.map(id => { const r = findRecipe(id); return r ? '<button type="button" class="rlink" data-recipe="' + id + '">📖 ' + esc(r.name) + '</button>' : ''; }).join('');
  return html ? '<div class="rl">' + html + '</div>' : '';
}
function nextRhythm() { const hm = nowHM(); for (const r of RHYTHM) if (r[0] > hm) return r; return null; }
function shortRhythm(t) {
  const s = String(t).replace(/\s*\([^)]*\)/g, '').replace(/:\s*/, ' · ').trim();
  if (s.length <= 46) return s;
  const cut = Math.max(s.lastIndexOf(';', 46), s.lastIndexOf(',', 46));
  if (cut > 12) return s.slice(0, cut).trim();
  const sp = s.lastIndexOf(' ', 44); return s.slice(0, sp > 12 ? sp : 44).trim() + '…';
}
function weightDelta(L, c, prev) {
  if (L.weight != null) { const a = L.weight - c.startWeight, b = prev ? L.weight - prev.weight : null; return 'Başlangıca göre <b>' + sgn(a) + ' kg</b>' + (b != null ? ' · önceki tartıya göre ' + sgn(b) : ''); }
  if (prev) return 'Son tartı <b>' + n1(prev.weight) + ' kg</b> · ' + fmtD(prev.date);
  return 'Başlangıç <b>' + n1(c.startWeight) + ' kg</b>';
}
function dayStreak(p) {
  const c = cfg(p); let d = state.today, n = 0;
  const Lt = state.logs[logId(p, d)]; if (!Lt || dayPoints(Lt, c) < DAY_WIN) d = addDays(d, -1);
  while (n < 400) { const L = state.logs[logId(p, d)]; if (!L || dayPoints(L, c) < DAY_WIN) break; n++; d = addDays(d, -1); }
  return n;
}
function motto(L, c, pts, p, lp) {

  if (pts >= DAY_WIN) return 'Gün kazanıldı. Mutfak kapandı, şampiyon 🥇';
  if (h < 9 && !L.run) return 'Koşu seni bekliyor; sabah ışığı en iyi antidepresan 🌤';
  if (h >= 14 && L.water < c.waterGoal * 0.4) return 'Su! Kaktüs değilsin 🌵';

  if (pts >= 8) return 'Bir iki adım kaldı: yürüyüş, su ya da erken yatış 🚶';

  return pool[parseD(state.date).getDay()];
}
function heroHtml(p, L, c) {

  const chips = PERSON_LOCK ? '' : '<div class="pchips">' + ['E', 'K'].map(q => '<button type="button" class="pchip' + (q === state.person ? ' on' : '') + '" data-person="' + q + '">' + esc(cfg(q).name) + '</button>').join('') + '</div>';

  return '<div class="hero">' +
    '<div class="hero-top"><div class="avatar">' + (p === 'E' ? '🧔' : '👩') + '</div><div class="grow"><div class="greet">' + greet + '</div>' + sub + '</div>' + chips + '</div>' +

function waterLabel(L, c) { return n1(L.water * 0.25) + ' L' + (L.water >= c.waterGoal ? ' · +2 puan ✓' : ''); }
function updateWaterUI(L, c) {
  const cnt = $('#waterCount'), lit = $('#waterLitre'); if (cnt) cnt.textContent = L.water; if (lit) { lit.textContent = waterLabel(L, c); lit.className = 'pill ' + (L.water >= c.waterGoal ? 'good' : 'water'); }

function questRow(q, L) {

}
function questsHtml(p, L, c) {
  const d = state.date, dow = parseD(d).getDay(), menu = menuFor(d), isToday = d === state.today, nx = isToday ? nextRhythm() : null, hm = nowHM();
  const earlier = logsOf(p).filter(l => l.weight != null && l.date < d), prev = earlier.length ? earlier[earlier.length - 1] : null;
  const items = [{ id: 'run', f: 'run', t: '06:15', name: 'Sabah koşusu', pts: 1, on: L.run, kind: 'toggle' }];

  items.push({ id: 'walkEve', f: 'walkEve', t: '19:45', name: 'Akşam yürüyüşü', pts: 1, on: L.walkEve, kind: 'toggle', menu: '10 dk · sonra mutfak kapanır' });
  items.push({ id: 'strength', f: 'strength', t: '20:00', name: 'Kuvvet 15 dk', pts: 0, on: L.strength, kind: 'toggle', menu: '3 tur · squat, şınav, plank, köprü' });
  items.push({ id: 'sleep', t: '23:00', name: 'Uyku düzeni', pts: 1, on: sleepOk(L), kind: 'sleep', menu: 'Yatış en geç 23:15 · kalkış en geç ' + wakeLimit(d) + (L.sleep != null ? ' · ' + n1(L.sleep) + ' saat uyku' : '') });

  ];
  const paneBody = key => {
    if (key === 'su') return waterPane(L, c);

  };

function waterPane(L, c) {

function restorePane() { const el = $('#panes'); if (!el) return; const w = el.clientWidth; if (w) el.scrollLeft = (state.pane || 0) * w; }
function foodsBody(L, p) {

function subSec(id, icon, title, sub, body) { return '<details class="sub-sec" id="' + id + '"' + (state.open.has(id) ? ' open' : '') + '><summary><span class="ic">' + icon + '</span><span class="st">' + title + '<span class="sub">' + sub + '</span></span></summary><div class="body">' + body + '</div></details>'; }
function renderToday() {
  const p = state.person, d = state.date, L = getLog(p, d), c = cfg(p);

</script>
