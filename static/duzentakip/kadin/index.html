<script>
'use strict';
// ---------- utilities ----------
const $ = (s, r) => (r || document).querySelector(s);
const pad = n => String(n).padStart(2, '0');
function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return dstr(new Date()); }
function parseD(s) { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }

function mondayOf(s) { const d = parseD(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return dstr(d); }
const DAYS_TR = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const MONTHS_TR = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
function fmtD(s) { const d = parseD(s); return DAYS_TR[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_TR[d.getMonth()]; }
function fmtDL(s) { const d = parseD(s); return d.getDate() + ' ' + MONTHS_TR[d.getMonth()] + ' ' + d.getFullYear(); }
function n1(x) { return (Math.round(x * 10) / 10).toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function sgn(x) { return (x > 0 ? '+' : '') + n1(x); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function num(v, lo, hi) { if (v == null || v === '') return null; const n = Number(v); return isFinite(n) && n >= lo && n <= hi ? n : null; }
function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s));

// ---------- state ----------
const PERSON_LOCK = (window.PERSON_LOCK === 'E' || window.PERSON_LOCK === 'K') ? window.PERSON_LOCK : null;
const state = {
  person: PERSON_LOCK || (lsGet('bt_person', 'E') === 'K' ? 'K' : 'E'),
  date: todayStr(), today: todayStr(), tab: 'bugun',
  logs: {}, settings: { E: null, K: null }, rewards: null, recipes: {}, analysis: {},
  mode: 'loading', db: null, sample: null, assets: null, imgOk: false,
  dirty: new Set(), pendingLocal: new Set(), timers: new Map(), inflight: new Map(),
  busy: new Set(), showWeight: false, modeNote: ''
};
const STATIC_HOST = !(window.claude && typeof window.claude.use === 'function');
function logId(p, d) { return p + '_' + d; }
function emptyLog(p, d) {
  return { person: p, date: d, weight: null, water: 0, meals: { k: false, a1: false, o: false, a2: false, ak: false }, vinegar: false,
    run: false, walkNoon: false, walkEve: false, strength: false, bed: '', sleep: null, note: '', foods: [], updatedAt: '' };
}
function normFood(f) {
  if (!f || typeof f !== 'object') return null;
  const meal = ['k', 'a1', 'o', 'a2', 'ak', 'x'].indexOf(f.meal) >= 0 ? f.meal : 'x';
  return { id: String(f.id || uid()).slice(0, 24), t: /^\d{2}:\d{2}$/.test(String(f.t)) ? f.t : '', meal: meal,
    text: typeof f.text === 'string' ? f.text.slice(0, 300) : '', photo: /^[0-9a-f]{32}$/.test(String(f.photo)) ? f.photo : null,
    kcal: num(f.kcal, 0, 3000), protein: num(f.protein, 0, 300), comment: typeof f.comment === 'string' ? f.comment.slice(0, 400) : '',
    status: f.status === 'ok' ? 'ok' : 'none' };
}
function normLog(l) {
  if (!l || (l.person !== 'E' && l.person !== 'K') || !isDate(l.date)) return null;
  const e = emptyLog(l.person, l.date);
  e.weight = num(l.weight, 30, 250);
  e.water = Math.round(num(l.water, 0, 30) || 0);
  MEAL_KEYS.forEach(k => { e.meals[k] = !!(l.meals && l.meals[k]); });
  ['vinegar', 'run', 'walkNoon', 'walkEve', 'strength'].forEach(k => { e[k] = !!l[k]; });
  e.bed = typeof l.bed === 'string' ? l.bed.slice(0, 5) : '';
  e.sleep = num(l.sleep, 0, 14);
  e.note = typeof l.note === 'string' ? l.note.slice(0, 1000) : '';
  e.foods = Array.isArray(l.foods) ? l.foods.map(normFood).filter(Boolean).slice(0, 12) : [];
  e.updatedAt = typeof l.updatedAt === 'string' ? l.updatedAt.slice(0, 30) : '';
  return e;
}
function getLog(p, d) { const l = state.logs[logId(p, d)]; return l ? clone(l) : emptyLog(p, d); }
function cfg(p) {
  const s = Object.assign({}, DEFAULTS[p], state.settings[p] || {});
  ['startWeight', 'goalWeight', 'rate', 'waterGoal', 'kcal', 'height'].forEach(k => { const v = Number(s[k]); s[k] = isFinite(v) && v > 0 ? v : DEFAULTS[p][k]; });
  s.name = String(s.name || DEFAULTS[p].name).slice(0, 20);
  if (!isDate(s.startDate)) s.startDate = DEFAULTS[p].startDate;
  const wd = Number(s.weighDay); s.weighDay = isFinite(wd) && wd >= 0 && wd <= 6 ? Math.round(wd) : 5;
  if (p === 'K') {
    s.cycleStart = isDate(s.cycleStart) ? s.cycleStart : '';
    s.cycleLen = Math.round(num(s.cycleLen, 20, 45) || 28);
    s.periodLen = Math.round(num(s.periodLen, 2, 10) || 5);
    s.cycleHistory = Array.isArray(s.cycleHistory) ? s.cycleHistory.filter(isDate).slice(-12) : [];
  }
  return s;
}
const RUNG_WEEKS = [1, 2, 4, 8, 13, 26];
const RUNG_LABELS = { 1: 'Her hafta', 2: '2 hafta', 4: '1 ay', 8: '2 ay', 13: '3 ay', 26: '6 ay' };
const LADDER_DEFAULT = {
  E: [{ weeks: 1, icon: '🕌', title: 'Camii gezisi' }, { weeks: 2, icon: '🩸', title: 'Detaylı kan tahlili' }, { weeks: 4, icon: '🦷', title: 'Diş temizletme' }, { weeks: 8, icon: '👟', title: 'Koşu ekipmanı' }, { weeks: 13, icon: '🎿', title: 'Kayak tatili' }, { weeks: 26, icon: '✨', title: 'Tüm eşyalarımı sıfırlama' }],
  K: [{ weeks: 1, icon: '📍', title: 'Yeni bir mekân gezisi' }, { weeks: 2, icon: '🍽️', title: 'AKM\'de yemek' }, { weeks: 4, icon: '📖', title: 'Kubi bir kitap okuyacak' }, { weeks: 8, icon: '📱', title: 'Telefon yenileme' }, { weeks: 13, icon: '🎿', title: '3–4 gün kayak tatili' }, { weeks: 26, icon: '🏝️', title: 'Girit adası tatili' }]
};
function normRewards(doc) {
  const d = doc && typeof doc === 'object' ? doc : {};
  const out = { threshold: Math.round(num(d.threshold, 20, 75) || REWARD_DEFAULT_POINTS), ladder: { E: [], K: [] }, claimed: { E: {}, K: {} } };
  ['E', 'K'].forEach(p => {
    const src = d.ladder && Array.isArray(d.ladder[p]) ? d.ladder[p] : [];
    out.ladder[p] = RUNG_WEEKS.map((w, i) => { const r = src.find(x => x && Number(x.weeks) === w) || {}; const def = LADDER_DEFAULT[p][i]; return { weeks: w, icon: String(r.icon || def.icon).slice(0, 4), title: String(r.title || def.title).slice(0, 80) }; });
    const cl = d.claimed && d.claimed[p] && typeof d.claimed[p] === 'object' ? d.claimed[p] : {};
    Object.keys(cl).forEach(k => { if (/^w(2|4|8|13|26)$/.test(k) && isDate(cl[k])) out.claimed[p][k] = cl[k]; });
  });
  return out;
}
state.rewards = normRewards(null);
function ladderProgress(p) {
  const c = cfg(p), th = state.rewards.threshold, start = mondayOf(c.startDate), cur = mondayOf(state.today);
  const weeks = []; let count = 0, streak = 0;
  for (let ws = start; ws <= cur; ws = addDays(ws, 7)) { const pts = weekPoints(p, ws).points, ok = pts >= th; weeks.push({ ws: ws, points: pts, ok: ok }); if (ok) { count++; streak++; } else if (ws !== cur) streak = 0; }
  const curW = weeks.length ? weeks[weeks.length - 1] : { ws: cur, points: weekPoints(p, cur).points, ok: false };
  const frac = curW.ok ? 0 : Math.min(0.99, curW.points / th);
  const ladder = state.rewards.ladder[p], claimed = state.rewards.claimed[p];
  const next = ladder.find(r => r.weeks > 1 && count < r.weeks) || null;
  const earned = ladder.filter(r => r.weeks > 1 && count >= r.weeks && !claimed['w' + r.weeks]);
  return { weeks: weeks, count: count, streak: streak, current: curW, progress: count + frac, next: next, earned: earned, warmup: cur < start, threshold: th };
}
function normRecipe(doc) {
  const r = doc && typeof doc === 'object' ? doc : {};
  const rt = r.rating && typeof r.rating === 'object' ? r.rating : {}, fv = r.fav && typeof r.fav === 'object' ? r.fav : {};
  return { rating: { E: Math.round(num(rt.E, 0, 5) || 0), K: Math.round(num(rt.K, 0, 5) || 0) }, fav: { E: !!fv.E, K: !!fv.K }, note: typeof r.note === 'string' ? r.note.slice(0, 300) : '' };
}
function localTime(iso) { const d = new Date(iso); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function logsOf(p) { return Object.values(state.logs).filter(l => l && l.person === p).sort((a, b) => (a.date < b.date ? -1 : 1)); }
function canDb() { return !!state.db && state.mode !== 'local'; }

// ---------- points, rewards, cycle ----------
function dayPoints(L, c) {
  let p = MEAL_KEYS.filter(k => L.meals[k]).length;
  if (L.water >= c.waterGoal) p += 2;
  if (L.run) p += 1; if (L.walkNoon) p += 1; if (L.walkEve) p += 1;
  return p;
}
function weekPoints(p, ws) {
  const c = cfg(p); let pts = 0, weighed = false;
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); const L = state.logs[logId(p, d)]; if (!L) continue; pts += dayPoints(L, c); if (L.weight != null) weighed = true; }
  return { points: pts + (weighed ? 5 : 0), weighed: weighed, max: 75 };
}
function cycleInfo(c, date) {
  if (!c.cycleStart) return null;
  const L = c.cycleLen, P = c.periodLen;
  let diff = daysBetween(c.cycleStart, date); if (diff < 0) return null;
  const day = (diff % L) + 1;
  const next = addDays(c.cycleStart, (Math.floor(diff / L) + 1) * L);
  let phase, tip;
  if (day <= P) { phase = 'Adet'; tip = 'Demir için mercimek, ıspanak ve limon; kafeini azalt; hafif koşu uygun. Tartı sonucu bu günlerde yanıltıcı olabilir.'; }
  else if (day < L - 15) { phase = 'Foliküler'; tip = 'Enerjinin en yüksek dönemi: kuvvet antrenmanı ve kilo hedefi için en verimli hafta.'; }
  else if (day <= L - 13) { phase = 'Yumurtlama'; tip = 'İştah normal; su ve lifi aksatma.'; }
  else if (day > L - 10) { phase = 'Luteal · PMS'; tip = 'Tatlı isteği ve 1–2 kg su tutulması normal. Planlı tatlıyı kullan, magnezyum (kabak çekirdeği, ceviz) artır, tartıyı bu hafta yorumlama.'; }
  else { phase = 'Luteal'; tip = 'İştah hafif artar; proteinli ara öğünleri atlama, uykuyu koru.'; }
  return { day: day, phase: phase, tip: tip, next: next, pms: day > L - 10 };
}

// ---------- storage ----------
function loadLocal() {
  const raw = lsGet('bt_logs_v1', {}) || {};
  state.logs = {};
  Object.keys(raw).forEach(id => { const l = normLog(raw[id]); if (l) state.logs[logId(l.person, l.date)] = l; });
  const s = lsGet('bt_settings_v1', {}) || {};
  state.settings.E = s.E || null; state.settings.K = s.K || null;
  state.rewards = normRewards(lsGet('bt_rewards_v1', null));
  const rc = lsGet('bt_recipes_v1', {}) || {}; state.recipes = {}; Object.keys(rc).forEach(id => { state.recipes[id] = normRecipe(rc[id]); });
  state.analysis = lsGet('bt_analysis_v1', {}) || {};
}
function persistLocal() { lsSet('bt_logs_v1', state.logs); lsSet('bt_settings_v1', state.settings); lsSet('bt_rewards_v1', state.rewards); lsSet('bt_recipes_v1', state.recipes); lsSet('bt_analysis_v1', state.analysis); }

function setStatus(t) { const st = $('#saveStatus'); if (st) st.textContent = t; }
function saveLog(doc) {
  doc.updatedAt = new Date().toISOString();
  const id = logId(doc.person, doc.date);
  state.logs[id] = doc;
  if (canDb()) { state.dirty.add(id); clearTimeout(state.timers.get(id)); state.timers.set(id, setTimeout(() => flush(id), 700)); setStatus('Kaydediliyor…'); }
  else { persistLocal(); if (state.mode === 'loading') state.pendingLocal.add(id); setStatus('Bu cihaza kaydedildi ' + nowHM()); }
}
function flush(id) {
  state.timers.delete(id);
  const doc = state.logs[id]; if (!doc || !state.db) return;
  const prev = state.inflight.get(id) || Promise.resolve();
  const p = prev.then(() => state.db.doc('logs/' + id).set(doc)).then(() => { if (!state.timers.has(id)) state.dirty.delete(id); setStatus('Kaydedildi ' + nowHM() + ' · ikinizde de görünür'); })
    .catch(err => { state.dirty.delete(id); if (err && err.code === 'invalid_argument') fallbackLocal('Bu hesabın paylaşımlı kayıt yetkisi yok; girdiler bu cihazda saklanıyor.'); else setStatus('Kayıt başarısız (' + (err && err.code ? err.code : 'bağlantı') + '). Birazdan tekrar deneyin.'); });
  state.inflight.set(id, p);
}
function fallbackLocal(msg) { if (state.mode === 'local') return; setMode('local', 'Bu cihazda'); state.modeNote = msg; persistLocal(); const n = $('#modeNote'); if (n) n.textContent = msg; }
async function writeDoc(path, data) {
  if (canDb()) { try { await state.db.doc(path).set(data); return true; } catch (err) { if (err && err.code === 'invalid_argument') fallbackLocal('Bu hesabın paylaşımlı kayıt yetkisi yok; veriler bu cihazda saklandı.'); return false; } }
  persistLocal(); return true;
}
async function saveSettings(p, s) { state.settings[p] = s; return writeDoc('settings/' + p, s); }
async function saveRewards() { state.rewards = normRewards(state.rewards); return writeDoc('settings/rewards', state.rewards); }
async function saveRecipe(id, patch) { const cur = state.recipes[id] || normRecipe(null); const next = normRecipe(Object.assign({}, cur, patch, { rating: Object.assign({}, cur.rating, patch.rating || {}), fav: Object.assign({}, cur.fav, patch.fav || {}) })); state.recipes[id] = next; return writeDoc('recipes/' + id, next); }
async function saveAnalysis(key, doc) { state.analysis[key] = doc; return writeDoc('analysis/' + key, doc); }
async function connect() {
  loadLocal(); renderAll();
  if (STATIC_HOST) { setMode('local', 'Bu cihazda'); state.modeNote = 'Girdiler yalnızca bu cihazda saklanıyor.'; renderAll(); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  window.claude.use('sample').then(async s => { state.sample = s; if (s && s.limits) { try { const lim = await s.limits(); state.imgOk = !!(lim && lim.images); } catch (e) { state.imgOk = false; } } renderAll(); }).catch(() => {});
  window.claude.use('assets').then(a => { state.assets = a; renderAll(); }).catch(() => {});
  if (!db) { setMode('local', 'Bu cihazda'); state.modeNote = 'Paylaşımlı kayıt bu görünümde kapalı; girdiler yalnızca bu cihazda saklanıyor.'; renderAll(); return; }
  state.db = db;
  let loaded = false;
  const timer = setTimeout(() => { if (!loaded) setMode('loading', 'Veriye ulaşılamıyor'); }, 10000);
  db.collection('logs').limit(1000).onSnapshot(snap => {
    loaded = true; clearTimeout(timer);
    const next = {};
    snap.docs.forEach(d => { const l = normLog(d.data()); if (l) next[logId(l.person, l.date)] = l; });
    state.dirty.forEach(id => { if (state.logs[id]) next[id] = state.logs[id]; });
    state.pendingLocal.forEach(id => { if (state.logs[id]) { next[id] = state.logs[id]; state.dirty.add(id); clearTimeout(state.timers.get(id)); state.timers.set(id, setTimeout(() => flush(id), 300)); } });

    state.logs = next;
    setMode('db', snap.metadata.fromCache ? 'Önbellek' : 'Paylaşımlı');

<script>
'use strict';

function editLog(fn) { const L = getLog(state.person, state.date); fn(L); saveLog(L); return L; }

function guessMeal() { const hm = nowHM(); if (hm < '09:30') return 'k'; if (hm < '11:45') return 'a1'; if (hm < '15:00') return 'o'; if (hm < '17:30') return 'a2'; if (hm < '21:00') return 'ak'; return 'x'; }
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1280, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);

    img.src = url;
  });
}

    'Kişi: ' + who + '. Bugüne kadar kayıtlı diğer öğünler: ' + Math.round(others) + ' kcal.\n' +

    (planned ? 'Programdaki plan: ' + planned.t + ' · porsiyon: ' + (planned[p] || 'belirtilmemiş') + '.\n' : '') +

    (hasImage ? 'Fotoğraftaki yemeği tanı, porsiyonu tabak ve kaşık ölçüsünden tahmin et.\n' : '') +
    'Yalnızca şu JSON nesnesini döndür, başka metin yazma: {"aciklama": "ne yenmiş, en fazla 12 kelime", "kcal": sayı, "protein_g": sayı, "uyum": "iyi" | "orta" | "zayif", "yorum": "Türkçe, en fazla 2 cümle, somut ve nazik öneri"}\n' +

}
async function analyzeFood(p, d, id, blob) {

      else if (a === 'foodRetry') { analyzeFood(state.person, state.date, act.dataset.id, null); }
      else if (a === 'claimRung') { const w = Number(act.dataset.w); if (RUNG_WEEKS.indexOf(w) > 0) { state.rewards.claimed[state.person]['w' + w] = state.today; await saveRewards(); renderToday(); } }

      else if (a === 'cycleStart') {
        const c = cfg('K'); const hist = c.cycleHistory.slice(); if (c.cycleStart && c.cycleStart !== state.date) hist.push(c.cycleStart);

    else if (meal) { const k = meal.dataset.meal; editLog(L => { L.meals[k] = !L.meals[k]; }); renderToday(); }
  });
  v.addEventListener('keydown', e => {
    const meal = e.target.closest('[data-meal]'); if (meal && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); meal.click(); return; }

}

<script>
'use strict';
// ---------- progress, weekly analysis, program ----------
function linfit(pts) { const n = pts.length; if (n < 2) return null; let sx = 0, sy = 0, sxx = 0, sxy = 0; for (const q of pts) { sx += q.x; sy += q.y; sxx += q.x * q.x; sxy += q.x * q.y; } const den = n * sxx - sx * sx; if (!den) return null; const m = (n * sxy - sx * sy) / den; return { m: m, b: (sy - m * sx) / n }; }
function planWeight(c, date) { const t = daysBetween(c.startDate, date); if (t < 0) return c.startWeight; return Math.max(c.goalWeight, c.startWeight - c.rate * t / 7); }
function planEndDate(c) { const weeks = c.rate > 0 ? (c.startWeight - c.goalWeight) / c.rate : 13; return addDays(c.startDate, Math.max(7, Math.ceil(weeks * 7))); }
function weekSummary(p, ws) {

  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i); if (d > state.today) break; s.days++;
    const L = state.logs[logId(p, d)]; if (!L) continue; s.logged++;
    MEAL_KEYS.forEach(k => { if (L.meals[k]) { s.meals[k]++; s.mealsDone++; } });
    s.water.push(L.water); if (L.water >= c.waterGoal) s.waterDays++;
    if (L.run) s.run++; if (L.walkNoon) s.walkNoon++; if (L.walkEve) s.walkEve++; if (L.strength) s.strength++;
    if (L.weight != null) s.weights.push({ d: d, w: L.weight });
    const kc = L.foods.reduce((a, f) => a + (f.kcal || 0), 0); if (kc > 0) s.kcal.push(kc);
    if (L.sleep != null) s.sleep.push(L.sleep); if (L.bed && L.bed > '23:15') s.late++;

}
function ruleAnalysis(p, s, prevS) {

  out.push('Puan: ' + s.points.points + '/75 (' + Math.round(s.points.points / 75 * 100) + '%). ' + (s.points.points >= 60 ? 'Çok iyi bir hafta.' : s.points.points >= 45 ? 'Program büyük ölçüde tuttu.' : 'Hafta zorlu geçmiş; aşağıdaki tek odağa bakın.'));
  const adh = denom ? Math.round(s.mealsDone / denom * 100) : 0;
  const worst = MEAL_KEYS.slice().sort((a, b) => s.meals[a] - s.meals[b])[0];
  out.push('Öğün uyumu %' + adh + (s.meals[worst] < s.logged ? '; en çok atlanan: ' + MEAL_NAMES[worst] + ' (' + s.meals[worst] + '/' + s.logged + ' gün).' : '; hiçbir öğün atlanmamış.'));
  const wa = avg(s.water);
  if (wa != null) out.push('Su ortalama ' + n1(wa) + ' bardak/gün (hedef ' + c.waterGoal + '); hedefe ulaşılan gün ' + s.waterDays + '/' + s.logged + '.');
  out.push('Hareket: koşu ' + s.run + ', öğle yürüyüşü ' + s.walkNoon + ', akşam yürüyüşü ' + s.walkEve + ', kuvvet ' + s.strength + ' gün.');
  if (s.weights.length) {
    const last = s.weights[s.weights.length - 1], plan = planWeight(c, last.d), diff = last.w - plan;
    let w = 'Tartı ' + n1(last.w) + ' kg (' + fmtD(last.d) + '); plana göre ' + (Math.abs(diff) <= 0.5 ? 'tam planda.' : diff < 0 ? n1(-diff) + ' kg önde.' : n1(diff) + ' kg geride.');
    if (prevS && prevS.weights.length) { const pw = prevS.weights[prevS.weights.length - 1].w; w += ' Geçen haftaya göre ' + sgn(last.w - pw) + ' kg.'; }
    out.push(w);
  } else out.push('Bu hafta tartı yok; haftalık tartı +5 puan ve gidişatın tek nesnel ölçüsü.');

  if (p === 'K') { const ci = cycleInfo(c, s.we < state.today ? s.we : state.today); if (ci) out.push('Döngü: ' + ci.phase + ' (' + ci.day + '. gün). ' + (ci.pms ? 'Tartıdaki dalgalanma ve tatlı isteği bu dönemde beklenir.' : '')); }
  let focus;

  else if (wa != null && wa < c.waterGoal * 0.7) focus = 'Su: masada 750 ml şişe, her ana öğünden 15 dk önce 1 bardak.';
  else if (s.walkNoon + s.walkEve < s.logged) focus = 'Yemek sonrası 10 dk yürüyüş: kan şekeri ve gece atıştırması için en ucuz araç.';

}
function renderProgress() {

  const f = v => v == null ? '—' : n1(v);
  const table = '<div class="tablewrap"><table><thead><tr><th>Hafta</th><th class="n">Puan</th><th class="n">Kilo</th><th class="n">Su</th><th class="n">Öğün %</th><th class="n">Koşu</th><th class="n">kcal</th></tr></thead><tbody>' +
    sums.map(s => { const lw = s.weights.length ? s.weights[s.weights.length - 1].w : null, ka = avg(s.kcal); return '<tr><td>' + parseD(s.ws).getDate() + '–' + parseD(s.we).getDate() + ' ' + MONTHS_TR[parseD(s.we).getMonth()] + (s.logged ? '' : ' <span class="tiny">(kayıt yok)</span>') + '</td><td class="n">' + (s.logged ? s.points.points : '—') + '</td><td class="n">' + f(lw) + '</td><td class="n">' + f(avg(s.water)) + '</td><td class="n">' + (s.logged ? Math.round(s.mealsDone / (s.logged * 5) * 100) : '—') + '</td><td class="n">' + (s.logged ? s.run : '—') + '</td><td class="n">' + (ka != null ? Math.round(ka) : '—') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  const key = p + '_' + ws0, prevKey = p + '_' + addDays(ws0, -7), an = state.analysis[key], anPrev = state.analysis[prevKey];

    '<div class="card"><div class="card-h"><h2>Haftalık özet</h2><span class="meta">Ortalamalar</span></div>' + table + '<p class="tiny">Puan haftalık /75 · su bardak/gün · öğün % = işaretlenen / 5 · kcal kayıtlı öğünlerden günlük ortalama</p></div>' +

    '<div class="grow"><div class="eyebrow">Toplam</div><div class="num" style="font-family:var(--font-display);font-weight:700;font-size:1.3rem">' + (both.some(b => b.has) ? '−' + n1(Math.max(0, both.reduce((s, b) => s + (b.has ? b.lost : 0), 0))) + ' kg' : '—') + '</div></div></div></div>');

function chartSvg(c, wl, today, endPlan) {
  const W = 360, H = 210, L = 38, R = 14, T = 14, B = 28;

async function claudeAnalysis(p, ws) {

  const st = $('#anStatus'); if (st) st.textContent = 'Claude yazıyor…';
  const btn = $('[data-action="claudeAnalyze"]'); if (btn) btn.disabled = true;
  try { const r = await state.sample(prompt, { modelTier: 'default', cache: false }); await saveAnalysis(p + '_' + ws, { text: r.text.slice(0, 4000), at: new Date().toISOString(), points: s.points.points }); }
  catch (e) { const code = e && e.code ? e.code : 'hata'; if (code === 'not_granted' || code === 'sampling_disabled') state.sample = null; const st2 = $('#anStatus'); if (st2) st2.textContent = code === 'rate_limited' ? 'Şu an çok istek var; birazdan deneyin.' : 'Yorum alınamadı (' + code + ').'; }
  if (state.tab === 'gelisim') renderProgress();
}
function bindProgress() {
  $('#view-gelisim').addEventListener('click', e => {
    const dot = e.target.closest('.dot'); if (dot) { $('#chartTip').textContent = fmtDL(dot.dataset.d) + ': ' + n1(Number(dot.dataset.w)) + ' kg'; return; }
    const b = e.target.closest('[data-action="claudeAnalyze"]'); if (b) claudeAnalysis(state.person, b.dataset.ws);
  });
}
function renderProgram() {
  const p = state.person, name = cfg(p).name, dow = parseD(state.today).getDay(), hm = nowHM();
  let curI = -1; RHYTHM.forEach((r, i) => { if (r[0] <= hm) curI = i; });
  const tl = RHYTHM.map((r, i) => '<div class="tl' + (i === curI ? ' now' : '') + '"><b>' + r[0] + '</b><span>' + esc(r[1]) + '</span></div>').join('');
  const days = [1, 2, 3, 4, 5, 6, 0].map(k => { const m = MENU[k]; return '<details' + (k === dow ? ' open' : '') + '><summary>' + m.name + (k === dow ? ' · bugün' : '') + '</summary><div class="mlist">' + m.meals.map(x => '<div class="mi"><b>' + MEAL_NAMES[x.k] + ' ' + MEAL_TIMES[x.k] + '</b> · ' + esc(x.t) + (x[p] ? '<span class="p">' + esc(name) + ': ' + esc(x[p]) + '</span>' : '') + '</div>').join('') + '<div class="tipbox">' + esc(m.tip) + '</div></div></details>'; }).join('');
  $('#view-program').innerHTML =
    '<div class="card"><div class="card-h"><h2>Günlük ritim</h2><span class="meta">Hafta içi · hafta sonu koşu 07:00, kahvaltı 08:30</span></div><div class="timeline">' + tl + '</div></div>' +
    '<div class="card"><div class="card-h"><h2>Haftalık menü</h2><span class="meta">' + esc(name) + ' porsiyonları</span></div><div>' + days + '</div></div>' +
    '<div class="card"><div class="card-h"><h2>Ara öğün havuzu</h2><span class="meta">100–150 kcal</span></div><ul class="plain">' + SNACKS.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>' +
    '<div class="card"><div class="card-h"><h2>İçecekler</h2></div><ul class="plain">' + DRINKS.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>' +
    '<div class="card"><div class="card-h"><h2>Neyi neyle</h2></div><ul class="plain">' + RULES.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>';
}
</script>

<script>
'use strict';
// ---------- recipes ----------
function renderRecipes() {
  const p = state.person, rc = id => state.recipes[id] || normRecipe(null);
  const list = RECIPES.map((r, i) => ({ r: r, i: i, d: rc(r.id) })).sort((a, b) => (b.d.fav[p] - a.d.fav[p]) || (b.d.rating[p] - a.d.rating[p]) || (a.i - b.i));
  const stars = (id, v) => '<span class="stars" data-rate="' + id + '">' + [1, 2, 3, 4, 5].map(n => '<button type="button" data-v="' + n + '"' + (n <= v ? ' class="on"' : '') + ' aria-label="' + n + ' yıldız">★</button>').join('') + '</span>';
  const items = list.map(x => { const r = x.r, d = x.d, other = p === 'E' ? 'K' : 'E';
    return '<details><summary><span>' + (d.fav[p] ? '♥ ' : '') + esc(r.name) + '<span class="sub">' + r.time + ' dk · ' + r.kcal.E + ' / ' + r.kcal.K + ' kcal (E / K) · ' + r.tags.join(', ') + (d.rating[p] ? ' · ' + '★'.repeat(d.rating[p]) : '') + '</span></span></summary>' +
      '<div class="mlist"><div class="rec-h">' + stars(r.id, d.rating[p]) + '<button type="button" class="chip' + (d.fav[p] ? ' on' : '') + '" data-fav="' + r.id + '">' + (d.fav[p] ? 'Favori' : 'Favorilere ekle') + '</button></div>' +
      (d.rating[other] || d.fav[other] ? '<p class="tiny">' + esc(cfg(other).name) + ': ' + (d.rating[other] ? '★'.repeat(d.rating[other]) : '') + (d.fav[other] ? ' ♥' : '') + '</p>' : '') +
      '<div><div class="eyebrow">Malzeme (2 kişilik)</div><ul class="plain">' + r.ing.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>' +
      '<div><div class="eyebrow">Yapılışı</div><ol class="plain">' + r.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol></div>' +
      '<p class="muted"><b>Porsiyon</b> · E: ' + esc(r.por.E) + ' · K: ' + esc(r.por.K) + '</p><div class="tipbox">' + esc(r.tip) + '</div>' +
      '<div class="field"><label for="rn-' + r.id + '">Notunuz (değişiklik, beğeni)</label><input type="text" id="rn-' + r.id + '" data-note="' + r.id + '" value="' + esc(d.note) + '" maxlength="300" placeholder="Örn. kimyonu artırdık, çocuklar sevdi"></div></div></details>'; }).join('');
  $('#view-tarifler').innerHTML = '<div class="card"><div class="card-h"><h2>Pratik tarifler</h2><span class="meta">' + RECIPES.length + ' tarif · favoriler üstte</span></div><p class="tiny">Programdaki yemeklerin iki kişilik tarifleri. Yıldızlayın, favorilere alın, notunuzu yazın; ikiniz de görürsünüz.</p><div>' + items + '</div></div>';
}
function bindRecipes() {
  const v = $('#view-tarifler'); const timers = new Map();
  v.addEventListener('click', async e => {
    const st = e.target.closest('[data-rate] button'); if (st) { const id = st.parentElement.dataset.rate, cur = (state.recipes[id] || normRecipe(null)).rating[state.person], val = Number(st.dataset.v); const patch = { rating: {} }; patch.rating[state.person] = cur === val ? 0 : val; await saveRecipe(id, patch); renderRecipes(); return; }
    const fv = e.target.closest('[data-fav]'); if (fv) { const id = fv.dataset.fav, cur = (state.recipes[id] || normRecipe(null)).fav[state.person]; const patch = { fav: {} }; patch.fav[state.person] = !cur; await saveRecipe(id, patch); renderRecipes(); }
  });
  v.addEventListener('input', e => { const id = e.target.dataset && e.target.dataset.note; if (!id) return; clearTimeout(timers.get(id)); const val = e.target.value.slice(0, 300); timers.set(id, setTimeout(() => saveRecipe(id, { note: val }), 800)); });
}

// ---------- settings ----------
function backupJson() { return JSON.stringify({ app: 'beslenme-takip', v: 2, exported: new Date().toISOString(), settings: { E: state.settings.E, K: state.settings.K }, rewards: state.rewards, recipes: state.recipes, analysis: state.analysis, logs: state.logs }); }
async function restoreBackup(text) {
  let data; try { data = JSON.parse(text); } catch (e) { return 'Yedek metni okunamadı; tamamını yapıştırdığınızdan emin olun.'; }
  if (!data || typeof data !== 'object' || !data.logs || typeof data.logs !== 'object') return 'Bu metin bir yedek değil.';
  let n = 0;
  for (const k of Object.keys(data.logs)) { const l = normLog(data.logs[k]); if (!l) continue; const id = logId(l.person, l.date), cur = state.logs[id]; if (cur && (cur.updatedAt || '') >= (l.updatedAt || '')) continue; state.logs[id] = l; n++; if (canDb()) { try { await state.db.doc('logs/' + id).set(l); } catch (e) {} } }
  if (data.settings && typeof data.settings === 'object') for (const p of ['E', 'K']) if (data.settings[p] && typeof data.settings[p] === 'object') { state.settings[p] = data.settings[p]; await writeDoc('settings/' + p, state.settings[p]); }
  if (data.rewards && typeof data.rewards === 'object') { const inc = normRewards(data.rewards); ['E', 'K'].forEach(q => { Object.assign(inc.claimed[q], state.rewards.claimed[q], inc.claimed[q]); }); state.rewards = inc; await saveRewards(); }
  if (data.recipes && typeof data.recipes === 'object') for (const id of Object.keys(data.recipes)) if (!state.recipes[id]) await saveRecipe(id, normRecipe(data.recipes[id]));
  if (data.analysis && typeof data.analysis === 'object') for (const k of Object.keys(data.analysis)) if (!state.analysis[k] && data.analysis[k] && typeof data.analysis[k].text === 'string') await saveAnalysis(k, data.analysis[k]);
  if (!canDb()) persistLocal();
  renderAll(); return n + ' günlük kayıt eklendi veya güncellendi.';
}
function renderSettings() {
  const p = state.person, c = cfg(p);
  const fld = (id, label, type, val, extra) => '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" value="' + esc(val) + '"' + (extra || '') + '></div>';
  const daySel = '<div class="field"><label for="sWeigh">Tartı günü</label><select id="sWeigh">' + [1, 2, 3, 4, 5, 6, 0].map(d => '<option value="' + d + '"' + (d === c.weighDay ? ' selected' : '') + '>' + DAY_NAMES[d] + '</option>').join('') + '</select></div>';
  const cycle = p === 'K' ? '<div class="card"><div class="card-h"><h2>Döngü ayarları</h2></div><div class="three">' + fld('sCycleStart', 'Son adet başlangıcı', 'date', c.cycleStart, ' max="' + state.today + '"') + fld('sCycleLen', 'Döngü (gün)', 'number', c.cycleLen, ' min="20" max="45" step="1" inputmode="numeric"') + fld('sPeriodLen', 'Adet süresi (gün)', 'number', c.periodLen, ' min="2" max="10" step="1" inputmode="numeric"') + '</div>' +
    (c.cycleHistory.length ? '<p class="tiny">Önceki başlangıçlar: ' + c.cycleHistory.slice(-6).map(fmtD).join(', ') + '. İki döngüden sonra süre otomatik güncellenir.</p>' : '<p class="tiny">"Adet başladı" düğmesi Bugün sekmesinde; her kullanımda geçmiş birikir ve döngü süresi kendini düzeltir.</p>') + '<div class="row"><button type="button" class="btn ghost" id="saveCycle">Döngüyü kaydet</button><span class="tiny" id="cycleStatus"></span></div></div>' : '';
  const ladderRows = state.rewards.ladder[p].map(r => '<div class="listrow"><span class="tiny" style="width:64px;flex:none">' + RUNG_LABELS[r.weeks] + '</span><input type="text" id="li' + r.weeks + '" value="' + esc(r.icon) + '" maxlength="4" aria-label="Simge" style="width:52px;text-align:center;flex:none"><input type="text" id="lw' + r.weeks + '" value="' + esc(r.title) + '" maxlength="80" aria-label="Ödül" class="grow">' + (state.rewards.claimed[p]['w' + r.weeks] ? '<span class="tiny" style="flex:none">alındı ' + fmtD(state.rewards.claimed[p]['w' + r.weeks]) + '</span>' : '') + '</div>').join('');
  $('#view-ayarlar').innerHTML =
    '<div class="card"><div class="card-h"><h2>' + esc(c.name) + ' · plan ayarları</h2></div>' + fld('sName', 'Görünen ad', 'text', c.name, ' maxlength="20"') +
    '<div class="two">' + fld('sStart', 'Başlangıç kilosu (kg)', 'number', c.startWeight, ' step="0.1" inputmode="decimal"') + fld('sGoal', 'Hedef kilo (kg)', 'number', c.goalWeight, ' step="0.1" inputmode="decimal"') + '</div>' +
    '<div class="two">' + fld('sDate', 'Başlangıç tarihi', 'date', c.startDate, '') + fld('sRate', 'Hedef tempo (kg/hafta)', 'number', c.rate, ' step="0.1" min="0.2" max="1" inputmode="decimal"') + '</div>' +
    '<div class="three">' + fld('sWater', 'Su hedefi (bardak)', 'number', c.waterGoal, ' step="1" min="4" max="20" inputmode="numeric"') + fld('sKcal', 'Günlük kcal', 'number', c.kcal, ' step="50" min="1200" max="3000" inputmode="numeric"') + daySel + '</div>' +
    '<div class="row"><button type="button" class="btn" id="saveSettings">Kaydet</button><span class="tiny" id="settingsStatus"></span></div>' +
    '<p class="tiny">Güvenli tempo: erkek 0,6–0,8, kadın 0,5 kg/hafta. Kadın için 62 kg bu tempoyla yaklaşık 24 haftada gelir; 3 ay sonunda 67–68 kg ara hedeftir.</p></div>' + cycle +
    '<div class="card"><div class="card-h"><h2>' + esc(c.name) + ' · ödül merdiveni</h2><span class="meta">Simge ve ödül düzenlenebilir</span></div><div>' + ladderRows + '</div>' +
    '<div class="field"><label for="rTh">Başarılı hafta eşiği (puan, 20–75; ikiniz için ortak)</label><input type="number" id="rTh" min="20" max="75" step="5" value="' + state.rewards.threshold + '" inputmode="numeric"></div>' +
    '<div class="row"><button type="button" class="btn ghost" id="saveLadder">Ödülleri kaydet</button><span class="tiny" id="ladderStatus"></span></div>' +
    '<p class="tiny">Puanlar: her öğün 1 (günde 5), su hedefi 2, koşu 1, öğle ve akşam yürüyüşü 1+1 → günde 10; haftalık tartı +5, haftada en çok 75. Haftada ' + state.rewards.threshold + ' puan = başarılı hafta; başarılı haftalar birikir (2 hafta, 1 ay = 4, 2 ay = 8, 3 ay = 13, 6 ay = 26). Haftalık ödül her başarılı haftada yenilenir.</p></div>' +
    '<div class="card"><div class="card-h"><h2>Kayıt durumu</h2></div><p>' + (state.mode === 'db' ? 'Paylaşımlı kayıt açık: iki telefonda da aynı veriler görünür.' : state.mode === 'local' ? 'Girdiler yalnızca bu cihazda saklanıyor.' : 'Bağlanıyor…') + '</p>' +
    (STATIC_HOST ? '<div class="note">Bu adreste girdiler telefonun kendi tarayıcı hafızasında tutulur ve iki telefon arasında eşzamanlanmaz. Her kişi kendi telefonundan girsin; tarayıcı verilerini silmek kayıtları siler, arada yedek alın.</div>' : (state.modeNote ? '<p class="tiny">' + esc(state.modeNote) + '</p>' : '') + '<div class="note">İki telefonda ortak takip için aynı Claude hesabıyla açın ya da sayfayı Paylaş menüsünden "Düzenleyici" veya "Katkıda bulunan" olarak e-posta ile davet edin. Yalnızca görüntüleme bağlantısıyla açan kişi veri giremez.</div>') + '</div>' +
    '<div class="card"><div class="card-h"><h2>Yedek</h2><span class="meta">Kopyala, sakla, gerekirse geri yükle</span></div><div class="row"><button type="button" class="btn ghost" id="copyBackup">Yedeği kopyala</button><span class="tiny" id="backupStatus"></span></div><textarea id="backupText" placeholder="Geri yüklemek için yedek metnini buraya yapıştırın" rows="3"></textarea><div class="row"><button type="button" class="btn ghost" id="restoreBackup">Yedeği geri yükle</button></div><p class="tiny">Yedek iki kişinin tüm kayıtlarını, ödülleri, tarif puanlarını ve ayarları içerir. Başka telefona taşımak için orada geri yükleyin; aynı günün daha yeni kaydı korunur.</p></div>';
}
function bindSettings() {
  $('#view-ayarlar').addEventListener('click', async e => {
    const p = state.person, c = cfg(p);
    const numv = (id, fb, lo, hi) => { const v = parseFloat(String($(id).value).replace(',', '.')); return isFinite(v) && v >= lo && v <= hi ? v : fb; };
    if (e.target.closest('#saveSettings')) {
      const s = Object.assign({}, c, { name: ($('#sName').value.trim() || c.name).slice(0, 20), startWeight: numv('#sStart', c.startWeight, 30, 250), goalWeight: numv('#sGoal', c.goalWeight, 30, 250), startDate: isDate($('#sDate').value) ? $('#sDate').value : c.startDate, rate: numv('#sRate', c.rate, 0.2, 1), waterGoal: Math.round(numv('#sWater', c.waterGoal, 4, 20)), kcal: Math.round(numv('#sKcal', c.kcal, 1200, 3000)), weighDay: Number($('#sWeigh').value) });
      if (s.goalWeight >= s.startWeight) { $('#settingsStatus').textContent = 'Hedef kilo başlangıçtan küçük olmalı.'; return; }
      await saveSettings(p, s); renderHeader(); $('#settingsStatus').textContent = 'Kaydedildi ' + nowHM(); return;
    }
    if (e.target.closest('#saveCycle')) { const s = Object.assign({}, c, { cycleStart: isDate($('#sCycleStart').value) && $('#sCycleStart').value <= state.today ? $('#sCycleStart').value : '', cycleLen: Math.round(numv('#sCycleLen', c.cycleLen, 20, 45)), periodLen: Math.round(numv('#sPeriodLen', c.periodLen, 2, 10)) }); await saveSettings('K', s); $('#cycleStatus').textContent = 'Kaydedildi ' + nowHM(); return; }
    if (e.target.closest('#saveLadder')) { state.rewards.ladder[p] = RUNG_WEEKS.map((w, i) => ({ weeks: w, icon: ($('#li' + w).value.trim() || LADDER_DEFAULT[p][i].icon).slice(0, 4), title: ($('#lw' + w).value.trim() || LADDER_DEFAULT[p][i].title).slice(0, 80) })); state.rewards.threshold = Math.round(numv('#rTh', state.rewards.threshold, 20, 75)); await saveRewards(); renderSettings(); $('#ladderStatus').textContent = 'Kaydedildi ' + nowHM(); return; }
    if (e.target.closest('#copyBackup')) { const json = backupJson(), ta = $('#backupText'), st = $('#backupStatus'); ta.value = json; try { await navigator.clipboard.writeText(json); st.textContent = 'Panoya kopyalandı ' + nowHM(); } catch (err) { ta.focus(); ta.select(); st.textContent = 'Metin seçildi; basılı tutup Kopyala deyin.'; } return; }
    if (e.target.closest('#restoreBackup')) { const st = $('#backupStatus'), txt = $('#backupText').value.trim(); if (!txt) { st.textContent = 'Önce yedek metnini yapıştırın.'; return; } st.textContent = 'Geri yükleniyor…'; const msg = await restoreBackup(txt); const st2 = $('#backupStatus'); if (st2) st2.textContent = msg; }
  });
}

// ---------- shell ----------
const TABS = ['bugun', 'gelisim', 'program', 'tarifler', 'ayarlar'];
function focusedInput() { const a = document.activeElement; return !!(a && $('#view-bugun').contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)); }
function renderHeader() {
  ['E', 'K'].forEach(p => { const b = $('#seg' + p), c = cfg(p); b.classList.toggle('on', state.person === p); b.innerHTML = esc(c.name) + '<span class="k">' + n1(c.startWeight) + ' → ' + n1(c.goalWeight) + ' kg</span>'; });
  if (PERSON_LOCK) { const c = cfg(PERSON_LOCK); $('#personSeg').hidden = true; $('.brand small').textContent = esc(c.name) + ' · ' + n1(c.startWeight) + ' → ' + n1(c.goalWeight) + ' kg · ' + c.kcal + ' kcal'; }
}
function renderTab() {
  TABS.forEach(t => { $('#view-' + t).hidden = state.tab !== t; $('#tab-' + t).classList.toggle('on', state.tab === t); });
  if (state.tab === 'bugun') { if (!focusedInput()) renderToday(); }
  else if (state.tab === 'gelisim') renderProgress();
  else if (state.tab === 'program') renderProgram();
  else if (state.tab === 'tarifler') { if (!(document.activeElement && $('#view-tarifler').contains(document.activeElement) && document.activeElement.tagName === 'INPUT')) renderRecipes(); }
  else renderSettings();
}
function renderAll() { renderHeader(); renderTab(); }
function setTab(t) { if (TABS.indexOf(t) < 0) t = 'bugun'; state.tab = t; if (location.hash.replace('#', '') !== t) { try { location.hash = t; } catch (e) {} } renderTab(); window.scrollTo(0, 0); }
function refreshNext() {
  const t = todayStr();
  if (state.today !== t) { if (state.date === state.today) state.date = t; state.today = t; if (state.tab === 'bugun' && !focusedInput()) renderToday(); return; }
  if (state.tab === 'bugun' && state.date === t && !focusedInput()) { const el = $('#view-bugun .next'), nx = nextRhythm(); if (el && nx) el.innerHTML = '<b>' + nx[0] + '</b><span>Sırada: ' + esc(nx[1]) + '</span>'; const fl = $('#flash'); if (fl) fl.innerHTML = gidisat(getLog(state.person, t), cfg(state.person)); }
}
function boot() {
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  window.addEventListener('hashchange', () => { const t = location.hash.replace('#', ''); if (t !== state.tab) setTab(t); });
  $('#personSeg').addEventListener('click', e => { const b = e.target.closest('[data-person]'); if (b && !PERSON_LOCK && b.dataset.person !== state.person) { state.person = b.dataset.person; state.showWeight = false; lsSet('bt_person', state.person); renderAll(); } });
  bindToday(); bindProgress(); bindRecipes(); bindSettings();
  const h = location.hash.replace('#', ''); state.tab = TABS.indexOf(h) >= 0 ? h : 'bugun';
  setInterval(refreshNext, 60000);
  connect();
}
boot();
</script>
