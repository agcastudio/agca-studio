@font-face { font-family: "Inter"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("/fonts/inter-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("/fonts/inter-turkish.woff2") format("woff2"); unicode-range: U+011E-011F, U+0130, U+015E-015F; }
/* Artifact iskeletinin karşılığı */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one 560px column, no header or footer. A game-card hero (points ring, reward bars), the day's quest list, then collapsible sections for everything else. */
:root {
  --bg: #F2F3EE;
  --surface: #FFFFFF;
  --surface-2: #E9EBE3;
  --line: #D7DACF;
  --ink: #1E221B;
  --ink-2: #585E52;
  --ink-3: #8B9085;
  --accent: #9B2F45;
  --accent-ink: #FFFFFF;
  --accent-soft: #F5E1E5;
  --good: #4C7A28;
  --good-ink: #FFFFFF;
  --good-soft: #E3EED6;
  --warn: #B4660C;
  --warn-soft: #FBE9D2;
  --water: #2F6F9F;
  --chart-area: rgba(155, 47, 69, 0.12);
  --hero: linear-gradient(135deg, #FBE9EC 0%, #FFFFFF 55%, #EDF2E4 100%);
  --shadow: 0 1px 2px rgba(30, 34, 27, 0.06), 0 6px 20px rgba(30, 34, 27, 0.05);
  --font-display: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15180F; --surface: #1F2319; --surface-2: #2A2F23; --line: #3A4033;
    --ink: #EEEDE6; --ink-2: #B7BAAF; --ink-3: #80857A;
    --accent: #E6808F; --accent-ink: #1E0A0E; --accent-soft: #3B2229;
    --good: #9FC86B; --good-ink: #10200A; --good-soft: #263A18; --warn: #E9AA5B; --warn-soft: #3D2C13;
    --water: #7FB3DC; --chart-area: rgba(230, 128, 143, 0.16);
    --hero: linear-gradient(135deg, #332026 0%, #1F2319 55%, #1F2A17 100%);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15180F; --surface: #1F2319; --surface-2: #2A2F23; --line: #3A4033;
  --ink: #EEEDE6; --ink-2: #B7BAAF; --ink-3: #80857A;
  --accent: #E6808F; --accent-ink: #1E0A0E; --accent-soft: #3B2229;
  --good: #9FC86B; --good-ink: #10200A; --good-soft: #263A18; --warn: #E9AA5B; --warn-soft: #3D2C13;
  --water: #7FB3DC; --chart-area: rgba(230, 128, 143, 0.16);
  --hero: linear-gradient(135deg, #332026 0%, #1F2319 55%, #1F2A17 100%);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.1rem; font-weight: 700; }
h3 { font-size: 0.95rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 16px; min-width: 0; max-width: 100%; }
input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.view { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card-h .meta { color: var(--ink-3); font-size: 0.82rem; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.muted { color: var(--ink-2); font-size: 0.9rem; }
.tiny { color: var(--ink-3); font-size: 0.8rem; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
/* hero */
.hero { background: var(--hero); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.hero-top { display: flex; align-items: center; gap: 12px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.7rem; box-shadow: var(--shadow); flex: none; }
.hname { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; }
.hsub { font-size: 0.82rem; color: var(--ink-2); }
.pchips { display: flex; gap: 6px; flex: none; }
.pchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }
.pchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ringrow { display: flex; align-items: center; gap: 14px; }
.ring { width: 96px; height: 96px; flex: none; }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent); transition: stroke-dasharray 0.4s; }
.ring.full .fg { stroke: var(--good); }
.ring text { font-family: var(--font-display); font-weight: 800; fill: var(--ink); }
.hstats { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.hstat { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
.hstat b { font-family: var(--font-display); }
.wbar { display: flex; align-items: center; gap: 8px; }
.wbar .bar { flex: 1; height: 12px; border-radius: 8px; }
.wbar .em { font-size: 1.3rem; flex: none; filter: grayscale(1); opacity: 0.6; }
.wbar.done .em { filter: none; opacity: 1; }
.wlabel { display: flex; justify-content: space-between; gap: 8px; font-size: 0.82rem; color: var(--ink-2); }
.lvl { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.lvl .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lvl .t b { font-family: var(--font-display); font-size: 1rem; }
.motto { font-style: italic; color: var(--ink-2); font-size: 0.92rem; }
.celebrate { background: var(--good-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 600; text-align: center; animation: pop 0.5s ease-out; }
@keyframes pop { from { transform: scale(0.96); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
.bar { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.25s; }
.bar.good i { background: var(--good); }
.bar.big { height: 14px; border-radius: 8px; }
/* quests */
.daterow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daterow .d { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; text-align: center; flex: 1; }
.daterow .d small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.78rem; color: var(--ink-3); }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; display: grid; place-items: center; flex: none; }
.iconbtn:disabled { opacity: 0.35; cursor: default; }
.next { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 0.9rem; }
.next b { font-family: var(--font-display); color: var(--accent); white-space: nowrap; }
.qlist { display: flex; flex-direction: column; }
.q { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.q:first-child { border-top: 0; }
.q .em { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 1.3rem; border: 2px solid transparent; }
.q.on .em { background: var(--good-soft); border-color: var(--good); }
.q.on .nm { text-decoration: line-through; color: var(--ink-2); }
.q .nm { font-family: var(--font-display); font-weight: 700; }
.q .tm { font-size: 0.78rem; color: var(--ink-3); margin-left: 6px; font-weight: 400; font-family: var(--font-body); }
.q .mn { font-size: 0.84rem; color: var(--ink-2); }
.q .pr { font-size: 0.82rem; color: var(--ink); background: var(--surface-2); border-radius: 8px; padding: 2px 8px; display: inline-block; margin-top: 3px; }
.q .pt { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.q.on .pt { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.q.zero .pt { opacity: 0.6; }
.rl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.rlink { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 9px; font-size: 0.78rem; color: var(--accent); font-weight: 600; }
.q.sleepq { cursor: default; }
.q.sleepq .row { margin-top: 6px; gap: 12px; }
.q.sleepq input[type="time"] { padding: 4px 6px; font-size: 0.95rem; margin-left: 4px; }
.drops { display: flex; flex-wrap: wrap; gap: 2px; }
.drop { background: none; border: 0; font-size: 1.45rem; line-height: 1; padding: 3px; filter: grayscale(1); opacity: 0.35; }
.drop.on { filter: none; opacity: 1; }
.waterline { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.waterline b { font-family: var(--font-display); color: var(--water); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--good-soft); border-color: var(--good); color: var(--ink); }
.chip.on::before { content: "✓"; color: var(--good); font-weight: 700; }
/* tabs (in-page views, not site navigation) */
.tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.tabs button { flex: 1; min-width: 0; border: 0; background: transparent; border-radius: 10px; padding: 9px 4px; font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
/* sections */
.sec { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after { content: "+"; color: var(--ink-3); font-size: 1.4rem; font-weight: 300; }
.sec[open] > summary::after { content: "−"; }
.sec[open] > summary { border-bottom: 1px solid var(--line); }
.sec .ic { font-size: 1.45rem; width: 36px; text-align: center; flex: none; }
.sec .st { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.sec .sub { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.8rem; color: var(--ink-3); white-space: normal; }
.sec > .view { padding: 12px 10px 14px; background: var(--bg); border-radius: 0 0 var(--radius) var(--radius); }
.sub-sec { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.sub-sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.sub-sec > summary::-webkit-details-marker { display: none; }
.sub-sec > summary::after { content: "+"; color: var(--ink-3); font-size: 1.3rem; font-weight: 300; }
.sub-sec[open] > summary::after { content: "−"; }
.sub-sec .ic { font-size: 1.25rem; width: 30px; text-align: center; flex: none; }
.sub-sec .st { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 700; }
.sub-sec .sub { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.8rem; color: var(--ink-3); }
.sub-sec > .body { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.foot { text-align: center; font-size: 0.78rem; color: var(--ink-3); display: flex; justify-content: center; align-items: center; gap: 6px; }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.sync.ok i { background: var(--good); }
.sync.local i { background: var(--warn); }
/* generic pieces */
.weightline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.weightline input { width: 110px; font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; text-align: center; padding: 6px 8px; }
.delta { font-size: 0.9rem; color: var(--ink-2); }
.delta b { color: var(--ink); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; font-size: 0.9rem; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 0.82rem; color: var(--ink-2); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .three { grid-template-columns: 1fr 1fr; } }
textarea { width: 100%; min-height: 64px; resize: vertical; }
.status { font-size: 0.8rem; color: var(--ink-3); text-align: right; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1.1; }
.tile .v small { font-size: 0.9rem; font-weight: 500; color: var(--ink-2); }
.tile .l { font-size: 0.78rem; color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.rung { text-align: center; font-size: 0.68rem; color: var(--ink-3); line-height: 1.2; }
.rung .ic { display: block; font-size: 1.35rem; line-height: 1.3; }
.rung.done { color: var(--good); font-weight: 600; }
.rung.next { color: var(--accent); font-weight: 700; }
.rung.lock { opacity: 0.55; }
.food { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: start; }
.food img, .food .ph { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); font-size: 1.3rem; }
.food .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.food .hd b { font-family: var(--font-display); }
.food .kc { font-family: var(--font-display); font-weight: 700; white-space: nowrap; }
.food .cm { font-size: 0.86rem; color: var(--ink-2); }
.food .busy { font-size: 0.86rem; color: var(--ink-3); font-style: italic; }
.food .del { background: none; border: 0; color: var(--ink-3); font-size: 0.8rem; padding: 0; text-decoration: underline; }
.addfood { display: flex; gap: 8px; align-items: center; }
.addfood input[type="text"], .addfood input[type="date"] { flex: 1; min-width: 0; }
.filebtn { position: relative; overflow: hidden; flex: none; }
.filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--ink-3); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 6 5; }
.chart .plan { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 2 4; }
.chart .line { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--chart-area); }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .lbl { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 5px; }
.legend i.goal { border-top: 2px dashed var(--ink-3); }
.legend i.plan { border-top: 2px dotted var(--ink-3); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
.tl:first-child { border-top: 0; }
.tl b { font-family: var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.tl.now { background: var(--accent-soft); margin: 0 -8px; padding-inline: 8px; border-radius: 8px; }
.tl.now b { color: var(--accent); }
.view details.item, .card details { border-top: 1px solid var(--line); padding: 6px 0; }
.view details.item:first-of-type, .card details:first-of-type { border-top: 0; }
.card details summary, .view details.item summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; padding: 6px 0; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card details summary::-webkit-details-marker, .view details.item summary::-webkit-details-marker { display: none; }
.card details summary::after, .view details.item summary::after { content: "+"; color: var(--ink-3); font-size: 1.2rem; flex: none; }
.card details[open] summary::after, .view details.item[open] summary::after { content: "−"; }
summary .sub { font-family: var(--font-body); font-weight: 400; font-size: 0.8rem; color: var(--ink-3); display: block; }
.mlist { display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; }

  for (let ws = start; ws <= cur; ws = addDays(ws, 7)) { const pts = weekPoints(p, ws).points, ok = pts >= th; weeks.push({ ws: ws, points: pts, ok: ok }); if (ok) { count++; streak++; } else if (ws !== cur) streak = 0; }
  const curW = weeks.length ? weeks[weeks.length - 1] : { ws: cur, points: weekPoints(p, cur).points, ok: false };
  const frac = curW.ok ? 0 : Math.min(0.99, curW.points / th);
  const ladder = state.rewards.ladder[p], claimed = state.rewards.claimed[p];

  const earned = ladder.filter(r => r.weeks > 1 && count >= r.weeks && !claimed['w' + r.weeks]);

}
function normRecipe(doc) {
  const r = doc && typeof doc === 'object' ? doc : {};
  const rt = r.rating && typeof r.rating === 'object' ? r.rating : {}, fv = r.fav && typeof r.fav === 'object' ? r.fav : {};
  return { rating: { E: Math.round(num(rt.E, 0, 5) || 0), K: Math.round(num(rt.K, 0, 5) || 0) }, fav: { E: !!fv.E, K: !!fv.K }, note: typeof r.note === 'string' ? r.note.slice(0, 300) : '' };
}
function localTime(iso) { const d = new Date(iso); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function logsOf(p) { return Object.values(state.logs).filter(l => l && l.person === p).sort((a, b) => (a.date < b.date ? -1 : 1)); }
function canDb() { return !!state.db && state.mode !== 'local'; }

// ---------- points, rewards, cycle ----------
const DAY_MAX = 11, DAY_WIN = 10, WEEK_MAX = 82;
function wakeLimit(date) { const d = parseD(date).getDay(); return (d === 0 || d === 6) ? '07:30' : '06:30'; }
function sleepOk(L) { if (!L.bed || !L.wake) return false; return L.bed >= '20:00' && L.bed <= '23:15' && L.wake >= '04:00' && L.wake <= wakeLimit(L.date); }

  if (L.water >= c.waterGoal) p += 2;
  if (L.run) p += 1; if (L.walkNoon) p += 1; if (L.walkEve) p += 1;
  if (sleepOk(L)) p += 1;
  return p;
}
function weekPoints(p, ws) {
  const c = cfg(p); let pts = 0, weighed = false;
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); const L = state.logs[logId(p, d)]; if (!L) continue; pts += dayPoints(L, c); if (L.weight != null) weighed = true; }
  return { points: pts + (weighed ? 5 : 0), weighed: weighed, max: WEEK_MAX };
}
function cycleInfo(c, date) {
  if (!c.cycleStart) return null;
  const L = c.cycleLen, P = c.periodLen;
  let diff = daysBetween(c.cycleStart, date); if (diff < 0) return null;
  const day = (diff % L) + 1;
  const next = addDays(c.cycleStart, (Math.floor(diff / L) + 1) * L);
  let phase, tip;
  if (day <= P) { phase = 'Adet'; tip = 'Demir için mercimek, ıspanak ve limon; kafeini azalt; hafif koşu uygun. Tartı sonucu bu günlerde yanıltıcı olabilir.'; }
  else if (day < L - 15) { phase = 'Foliküler'; tip = 'Enerjinin en yüksek dönemi: kuvvet antrenmanı ve kilo hedefi için en verimli hafta.'; }
  else if (day <= L - 13) { phase = 'Yumurtlama'; tip = 'İştah normal; su ve lifi aksatma.'; }
  else if (day > L - 10) { phase = 'Luteal · PMS'; tip = 'Tatlı isteği ve 1–2 kg su tutulması normal. Planlı tatlıyı kullan, magnezyum (kabak çekirdeği, ceviz) artır, tartıyı bu hafta yorumlama.'; }
  else { phase = 'Luteal'; tip = 'İştah hafif artar; proteinli ara öğünleri atlama, uykuyu koru.'; }
  return { day: day, phase: phase, tip: tip, next: next, pms: day > L - 10 };
}

// ---------- storage ----------
function loadLocal() {
  const raw = lsGet('bt_logs_v1', {}) || {};
  state.logs = {};
  Object.keys(raw).forEach(id => { const l = normLog(raw[id]); if (l) state.logs[logId(l.person, l.date)] = l; });
  const s = lsGet('bt_settings_v1', {}) || {};
  state.settings.E = s.E || null; state.settings.K = s.K || null;
  state.rewards = normRewards(lsGet('bt_rewards_v1', null));
  const rc = lsGet('bt_recipes_v1', {}) || {}; state.recipes = {}; Object.keys(rc).forEach(id => { state.recipes[id] = normRecipe(rc[id]); });
}
function persistLocal() { lsSet('bt_logs_v1', state.logs); lsSet('bt_settings_v1', state.settings); lsSet('bt_rewards_v1', state.rewards); lsSet('bt_recipes_v1', state.recipes); }
function setMode(m, text) { state.mode = m; const el = $('#sync'); if (el) el.className = 'sync ' + (m === 'db' ? 'ok' : m === 'local' ? 'local' : ''); const t = $('#syncText'); if (t) t.textContent = text; }
function setStatus(t) { const st = $('#saveStatus'); if (st) st.textContent = t; }
function saveLog(doc) {
  doc.updatedAt = new Date().toISOString();
  const id = logId(doc.person, doc.date);
  state.logs[id] = doc;
  if (canDb()) { state.dirty.add(id); clearTimeout(state.timers.get(id)); state.timers.set(id, setTimeout(() => flush(id), 700)); setStatus('Kaydediliyor…'); }
  else { persistLocal(); if (state.mode === 'loading') state.pendingLocal.add(id); setStatus('Bu cihaza kaydedildi ' + nowHM()); }
}
function flush(id) {
  state.timers.delete(id);
  const doc = state.logs[id]; if (!doc || !state.db) return;
  const prev = state.inflight.get(id) || Promise.resolve();
  const p = prev.then(() => state.db.doc('logs/' + id).set(doc)).then(() => { if (!state.timers.has(id)) state.dirty.delete(id); setStatus('Kaydedildi ' + nowHM() + ' · ikinizde de görünür'); })
    .catch(err => { state.dirty.delete(id); if (err && err.code === 'invalid_argument') fallbackLocal('Bu hesabın paylaşımlı kayıt yetkisi yok; girdiler bu cihazda saklanıyor.'); else setStatus('Kayıt başarısız (' + (err && err.code ? err.code : 'bağlantı') + '). Birazdan tekrar deneyin.'); });
  state.inflight.set(id, p);
}
function fallbackLocal(msg) { if (state.mode === 'local') return; setMode('local', 'Bu cihazda'); state.modeNote = msg; persistLocal(); const n = $('#modeNote'); if (n) n.textContent = msg; }
async function writeDoc(path, data) {
  if (canDb()) { try { await state.db.doc(path).set(data); return true; } catch (err) { if (err && err.code === 'invalid_argument') fallbackLocal('Bu hesabın paylaşımlı kayıt yetkisi yok; veriler bu cihazda saklandı.'); return false; } }
  persistLocal(); return true;
}
async function saveSettings(p, s) { state.settings[p] = s; return writeDoc('settings/' + p, s); }
async function saveRewards() { state.rewards = normRewards(state.rewards); return writeDoc('settings/rewards', state.rewards); }
async function saveRecipe(id, patch) { const cur = state.recipes[id] || normRecipe(null); const next = normRecipe(Object.assign({}, cur, patch, { rating: Object.assign({}, cur.rating, patch.rating || {}), fav: Object.assign({}, cur.fav, patch.fav || {}) })); state.recipes[id] = next; return writeDoc('recipes/' + id, next); }
async function connect() {
  loadLocal(); renderAll();
  if (STATIC_HOST) { setMode('local', 'bu cihazda saklanıyor'); state.modeNote = 'Girdiler yalnızca bu cihazda saklanıyor.'; renderAll(); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  window.claude.use('sample').then(async s => { state.sample = s; if (s && s.limits) { try { const lim = await s.limits(); state.imgOk = !!(lim && lim.images); } catch (e) { state.imgOk = false; } } renderAll(); }).catch(() => {});
  window.claude.use('assets').then(a => { state.assets = a; renderAll(); }).catch(() => {});
  if (!db) { setMode('local', 'bu cihazda saklanıyor'); state.modeNote = 'Paylaşımlı kayıt bu görünümde kapalı; girdiler yalnızca bu cihazda saklanıyor.'; renderAll(); return; }
  state.db = db;
  let loaded = false;

  db.collection('logs').limit(1000).onSnapshot(snap => {
    loaded = true; clearTimeout(timer);
    const next = {};
    snap.docs.forEach(d => { const l = normLog(d.data()); if (l) next[logId(l.person, l.date)] = l; });
    state.dirty.forEach(id => { if (state.logs[id]) next[id] = state.logs[id]; });
    state.pendingLocal.forEach(id => { if (state.logs[id]) { next[id] = state.logs[id]; state.dirty.add(id); clearTimeout(state.timers.get(id)); state.timers.set(id, setTimeout(() => flush(id), 300)); } });
    state.pendingLocal.clear();
    state.logs = next;
    setMode('db', snap.metadata.fromCache ? 'önbellekten' : 'paylaşımlı, ikinizde de görünür');
    renderAll();
  }, err => { clearTimeout(timer); fallbackLocal('Paylaşımlı veriye ulaşılamadı (' + (err && err.code ? err.code : 'hata') + '); girdiler bu cihazda saklanıyor.'); renderAll(); });
  db.collection('settings').onSnapshot(snap => { snap.docs.forEach(d => { if (d.id === 'E' || d.id === 'K') state.settings[d.id] = d.data(); else if (d.id === 'rewards') state.rewards = normRewards(d.data()); }); renderAll(); }, () => {});
  db.collection('recipes').onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { next[d.id] = normRecipe(d.data()); }); state.recipes = next; if (state.tab === 'tarifler') renderAll(); }, () => {});
}

<script>
'use strict';
// ---------- today: events and food logging ----------
function editLog(fn) { const L = getLog(state.person, state.date); fn(L); saveLog(L); return L; }
function updateFood(p, d, id, patch) { const L = getLog(p, d); const f = L.foods.find(x => x.id === id); if (!f) return; Object.assign(f, patch); saveLog(L); if (state.person === p && state.date === d && !focusedInput()) renderToday(); }
function guessMeal() { const hm = nowHM(); if (hm < '09:30') return 'k'; if (hm < '11:45') return 'a1'; if (hm < '15:00') return 'o'; if (hm < '17:30') return 'a2'; if (hm < '21:00') return 'ak'; return 'x'; }
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1280, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('encode')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
function foodPrompt(p, L, f, hasImage) {
  const c = cfg(p), menu = MENU[parseD(L.date).getDay()], planned = menu.meals.find(m => m.k === f.meal);
  const who = p === 'E' ? '35 yaşında erkek, 170 cm, hedef 1 800 kcal/gün, ailede tip 2 diyabet öyküsü' : '37 yaşında kadın, 160 cm, hedef 1 450 kcal/gün';
  const others = L.foods.filter(x => x.id !== f.id && x.kcal != null).reduce((s, x) => s + x.kcal, 0);
  return 'Sen deneyimli bir diyetisyensin. Kilo verme programındaki bir kişinin öğün kaydını değerlendir.\n' +
    'Kişi: ' + who + '. Bugüne kadar kayıtlı diğer öğünler: ' + Math.round(others) + ' kcal.\n' +
    'Öğün: ' + (MEAL_NAMES[f.meal] || 'ek öğün') + (f.t ? ' (' + f.t + ')' : '') + '.\n' +
    (planned ? 'Programdaki plan: ' + planned.t + ' · porsiyon: ' + (planned[p] || 'belirtilmemiş') + '.\n' : '') +
    'Kullanıcının yazdığı: ' + (f.text ? '"' + f.text + '"' : 'yok') + '.\n' +
    (hasImage ? 'Fotoğraftaki yemeği tanı, porsiyonu tabak ve kaşık ölçüsünden tahmin et.\n' : '') +
    'Yalnızca şu JSON nesnesini döndür, başka metin yazma: {"aciklama": "ne yenmiş, en fazla 12 kelime", "kcal": sayı, "protein_g": sayı, "uyum": "iyi" | "orta" | "zayif", "yorum": "Türkçe, en fazla 2 cümle, somut ve nazik öneri"}\n' +
    'kcal ve protein_g tek sayı olsun (aralık değil); emin değilsen orta değer ver. Program dışı bir şey yenmişse yargılamadan telafi öner.';
}
async function analyzeFood(p, d, id, blob) {
  if (!state.sample || STATIC_HOST) return;
  const L = getLog(p, d), f = L.foods.find(x => x.id === id); if (!f) return;
  state.busy.add(id); if (state.person === p && state.date === d) renderToday();
  const opts = { modelTier: 'default' }; if (blob && state.imgOk) opts.images = [blob];
  try {
    const r = await state.sample.json(foodPrompt(p, L, f, !!opts.images), opts);
    const kcal = num(r && r.kcal, 0, 3000), prot = num(r && r.protein_g, 0, 300);
    const desc = r && typeof r.aciklama === 'string' ? r.aciklama.slice(0, 80) : '';
    const yorum = r && typeof r.yorum === 'string' ? r.yorum.slice(0, 300) : '';
    const uyum = r && r.uyum === 'iyi' ? 'Uyum iyi. ' : r && r.uyum === 'orta' ? 'Uyum orta. ' : r && r.uyum === 'zayif' ? 'Plan dışı. ' : '';
    state.busy.delete(id);
    updateFood(p, d, id, { kcal: kcal, protein: prot, comment: (uyum + yorum).slice(0, 400), text: f.text || desc, status: 'ok' });
  } catch (e) {
    state.busy.delete(id);
    const code = e && e.code ? e.code : 'hata';
    const msg = code === 'not_granted' || code === 'sampling_disabled' ? 'Claude yorumu bu hesapta kapalı.' : code === 'rate_limited' ? 'Şu an çok istek var; birazdan tekrar deneyin.' : code === 'image_rejected' ? 'Fotoğraf okunamadı; yazıyla deneyin.' : 'Yorum alınamadı (' + code + ').';
    if (code === 'not_granted' || code === 'sampling_disabled') state.sample = null;
    updateFood(p, d, id, { comment: msg });
  }
}
async function addFood(text, file) {
  const p = state.person, d = state.date;
  const f = { id: uid(), t: d === state.today ? nowHM() : '', meal: d === state.today ? guessMeal() : 'x', text: (text || '').trim().slice(0, 300), photo: null, kcal: null, protein: null, comment: '', status: 'none' };
  if (!f.text && !file) return;
  const L = getLog(p, d); if (L.foods.length >= 12) { setStatus('Bir güne en fazla 12 öğün kaydı.'); return; }
  L.foods.push(f); saveLog(L); renderToday();
  let blob = null;
  if (file) {
    try { blob = await compressImage(file); } catch (e) { updateFood(p, d, f.id, { comment: 'Fotoğraf işlenemedi; yazıyla deneyin.' }); blob = null; }
    if (blob && state.assets) {
      try { const up = await state.assets.upload(blob, { type: 'image/jpeg' }); updateFood(p, d, f.id, { photo: up.id }); }
      catch (e) { updateFood(p, d, f.id, { comment: 'Fotoğraf kaydedilemedi (' + (e && e.code ? e.code : 'hata') + '); yorum yine de isteniyor.' }); }
    }
  }
  if (state.sample) analyzeFood(p, d, f.id, blob);
}
function bindToday() {
  const v = $('#view-bugun');
  v.addEventListener('click', async e => {
    const act = e.target.closest('[data-action]'), tog = e.target.closest('[data-toggle]'), meal = e.target.closest('[data-meal]'), pc = e.target.closest('[data-person]');
    if (pc) { if (!PERSON_LOCK && pc.dataset.person !== state.person) { state.person = pc.dataset.person; lsSet('bt_person', state.person); renderAll(); } return; }
    if (act) {
      const a = act.dataset.action;
      if (a === 'prevday') { state.date = addDays(state.date, -1); renderToday(); }
      else if (a === 'nextday' && state.date < state.today) { state.date = addDays(state.date, 1); renderToday(); }
      else if (a === 'water') { editLog(L => { L.water = Math.max(0, Math.min(30, L.water + Number(act.dataset.n))); }); renderToday(); }
      else if (a === 'drop') { const n = Number(act.dataset.n); editLog(L => { L.water = Math.max(0, Math.min(30, n === L.water ? n - 1 : n)); }); renderToday(); }
      else if (a === 'openWeight') { state.open.add('sub-tarti'); lsSet('bt_open', Array.from(state.open)); renderToday(); const w = $('#weightInput'); if (w) { w.scrollIntoView({ block: 'center' }); w.focus(); } }
      else if (a === 'foodAdd') { const t = $('#foodText'); await addFood(t ? t.value : '', null); }
      else if (a === 'foodDel') { const id = act.dataset.id; editLog(L => { L.foods = L.foods.filter(x => x.id !== id); }); renderToday(); }
      else if (a === 'foodRetry') { analyzeFood(state.person, state.date, act.dataset.id, null); }
      else if (a === 'claimRung') { const w = Number(act.dataset.w); if (RUNG_WEEKS.indexOf(w) > 0) { state.rewards.claimed[state.person]['w' + w] = state.today; await saveRewards(); renderToday(); } }
      else if (a === 'cycleSave') { const inp = $('#cycleDate'); if (!inp || !isDate(inp.value) || inp.value > state.today) return; const c = cfg('K'); c.cycleStart = inp.value; await saveSettings('K', c); renderToday(); }
      else if (a === 'cycleStart') {
        const c = cfg('K'); const hist = c.cycleHistory.slice(); if (c.cycleStart && c.cycleStart !== state.date) hist.push(c.cycleStart);
        const starts = hist.concat([state.date]).sort(); const lens = []; for (let i = 1; i < starts.length; i++) { const L = daysBetween(starts[i - 1], starts[i]); if (L >= 20 && L <= 45) lens.push(L); }
        c.cycleHistory = hist.slice(-12); c.cycleStart = state.date; if (lens.length >= 2) c.cycleLen = Math.round(avg(lens.slice(-4)));
        await saveSettings('K', c); renderToday();
      }
    } else if (tog) { const f = tog.dataset.toggle; editLog(L => { L[f] = !L[f]; }); renderToday(); }
    else if (meal) { const k = meal.dataset.meal; editLog(L => { L.meals[k] = !L.meals[k]; }); renderToday(); }
  });
  v.addEventListener('keydown', e => {
    const meal = e.target.closest('[data-meal]'); if (meal && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); meal.click(); return; }
    if (e.target.id === 'foodText' && e.key === 'Enter') { e.preventDefault(); addFood(e.target.value, null); }
  });
  v.addEventListener('change', e => {
    if (e.target.id === 'foodPhoto' && e.target.files && e.target.files[0]) { const t = $('#foodText'); addFood(t ? t.value : '', e.target.files[0]); e.target.value = ''; }
    else if (e.target.id === 'bedInput' || e.target.id === 'wakeInput') { e.target.blur(); renderToday(); }
  });
  v.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'weightInput') { const w = parseFloat(String(e.target.value).replace(',', '.')); const L = editLog(L => { L.weight = (isFinite(w) && w > 30 && w < 250) ? Math.round(w * 10) / 10 : null; }); const earlier = logsOf(state.person).filter(l => l.weight != null && l.date < state.date); const el = $('#weightDelta'); if (el) el.innerHTML = weightDelta(L, cfg(state.person), earlier.length ? earlier[earlier.length - 1] : null); }
    else if (id === 'bedInput') editLog(L => { L.bed = e.target.value || ''; L.sleep = sleepHours(L.bed, L.wake); });
    else if (id === 'wakeInput') editLog(L => { L.wake = e.target.value || ''; L.sleep = sleepHours(L.bed, L.wake); });
    else if (id === 'noteInput') editLog(L => { L.note = e.target.value.slice(0, 1000); });
  });
}

  const dayTips = [1, 2, 3, 4, 5, 6, 0].map(k => '<li><b>' + MENU[k].name + ':</b> ' + esc(MENU[k].tip) + '</li>').join('');
  $('#view-tarifler').innerHTML = '<div class="card"><div class="card-h"><h2>Pratik tarifler</h2><span class="meta">' + RECIPES.length + ' tarif · favoriler üstte</span></div><p class="tiny">Programdaki yemeklerin iki kişilik tarifleri. Yıldızlayın, favorilere alın, notunuzu yazın; ikiniz de görürsünüz.</p><div>' + items + '</div></div>' +
    '<div class="card"><div class="card-h"><h2>Püf noktaları</h2><span class="meta">Neyi neyle, nasıl pişir</span></div><ul class="plain">' + RULES.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>' +
    '<div class="card"><div class="card-h"><h2>Günün püf noktası</h2><span class="meta">Haftalık menüye göre</span></div><ul class="plain">' + dayTips + '</ul></div>';
}
function bindRecipes() {
  const v = $('#view-tarifler'); const timers = new Map();
  v.addEventListener('click', async e => {
    const st = e.target.closest('[data-rate] button'); if (st) { const id = st.parentElement.dataset.rate, cur = (state.recipes[id] || normRecipe(null)).rating[state.person], val = Number(st.dataset.v); const patch = { rating: {} }; patch.rating[state.person] = cur === val ? 0 : val; await saveRecipe(id, patch); renderRecipes(); return; }
    const fv = e.target.closest('[data-fav]'); if (fv) { const id = fv.dataset.fav, cur = (state.recipes[id] || normRecipe(null)).fav[state.person]; const patch = { fav: {} }; patch.fav[state.person] = !cur; await saveRecipe(id, patch); renderRecipes(); }
  });
  v.addEventListener('input', e => { const id = e.target.dataset && e.target.dataset.note; if (!id) return; clearTimeout(timers.get(id)); const val = e.target.value.slice(0, 300); timers.set(id, setTimeout(() => saveRecipe(id, { note: val }), 800)); });
}

// ---------- settings ----------
function backupJson() { return JSON.stringify({ app: 'beslenme-takip', v: 2, exported: new Date().toISOString(), settings: { E: state.settings.E, K: state.settings.K }, rewards: state.rewards, recipes: state.recipes, logs: state.logs }); }
async function restoreBackup(text) {
  let data; try { data = JSON.parse(text); } catch (e) { return 'Yedek metni okunamadı; tamamını yapıştırdığınızdan emin olun.'; }
  if (!data || typeof data !== 'object' || !data.logs || typeof data.logs !== 'object') return 'Bu metin bir yedek değil.';
  let n = 0;
  for (const k of Object.keys(data.logs)) { const l = normLog(data.logs[k]); if (!l) continue; const id = logId(l.person, l.date), cur = state.logs[id]; if (cur && (cur.updatedAt || '') >= (l.updatedAt || '')) continue; state.logs[id] = l; n++; if (canDb()) { try { await state.db.doc('logs/' + id).set(l); } catch (e) {} } }
  if (data.settings && typeof data.settings === 'object') for (const p of ['E', 'K']) if (data.settings[p] && typeof data.settings[p] === 'object') { state.settings[p] = data.settings[p]; await writeDoc('settings/' + p, state.settings[p]); }
  if (data.rewards && typeof data.rewards === 'object') { const inc = normRewards(data.rewards); ['E', 'K'].forEach(q => { Object.assign(inc.claimed[q], state.rewards.claimed[q], inc.claimed[q]); }); state.rewards = inc; await saveRewards(); }
  if (data.recipes && typeof data.recipes === 'object') for (const id of Object.keys(data.recipes)) if (!state.recipes[id]) await saveRecipe(id, normRecipe(data.recipes[id]));
  if (!canDb()) persistLocal();
  renderAll(); return n + ' günlük kayıt eklendi veya güncellendi.';
}
function renderSettings() {
  const p = state.person, c = cfg(p);
  const fld = (id, label, type, val, extra) => '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" value="' + esc(val) + '"' + (extra || '') + '></div>';
  const daySel = '<div class="field"><label for="sWeigh">Tartı günü</label><select id="sWeigh">' + [1, 2, 3, 4, 5, 6, 0].map(d => '<option value="' + d + '"' + (d === c.weighDay ? ' selected' : '') + '>' + DAY_NAMES[d] + '</option>').join('') + '</select></div>';
  const cycle = p === 'K' ? '<div class="card"><div class="card-h"><h2>Döngü ayarları</h2></div><div class="three">' + fld('sCycleStart', 'Son adet başlangıcı', 'date', c.cycleStart, ' max="' + state.today + '"') + fld('sCycleLen', 'Döngü (gün)', 'number', c.cycleLen, ' min="20" max="45" step="1" inputmode="numeric"') + fld('sPeriodLen', 'Adet süresi (gün)', 'number', c.periodLen, ' min="2" max="10" step="1" inputmode="numeric"') + '</div>' +
    (c.cycleHistory.length ? '<p class="tiny">Önceki başlangıçlar: ' + c.cycleHistory.slice(-6).map(fmtD).join(', ') + '. İki döngüden sonra süre otomatik güncellenir.</p>' : '<p class="tiny">"Adet başladı" düğmesi Bugün sekmesinde; her kullanımda geçmiş birikir ve döngü süresi kendini düzeltir.</p>') + '<div class="row"><button type="button" class="btn ghost" id="saveCycle">Döngüyü kaydet</button><span class="tiny" id="cycleStatus"></span></div></div>' : '';
  const ladderRows = state.rewards.ladder[p].map(r => '<div class="listrow"><span class="tiny" style="width:64px;flex:none">' + RUNG_LABELS[r.weeks] + '</span><input type="text" id="li' + r.weeks + '" value="' + esc(r.icon) + '" maxlength="4" aria-label="Simge" style="width:52px;text-align:center;flex:none"><input type="text" id="lw' + r.weeks + '" value="' + esc(r.title) + '" maxlength="80" aria-label="Ödül" class="grow">' + (state.rewards.claimed[p]['w' + r.weeks] ? '<span class="tiny" style="flex:none">alındı ' + fmtD(state.rewards.claimed[p]['w' + r.weeks]) + '</span>' : '') + '</div>').join('');
  $('#view-ayarlar').innerHTML =
    '<div class="card"><div class="card-h"><h2>' + esc(c.name) + ' · plan ayarları</h2></div>' + fld('sName', 'Görünen ad', 'text', c.name, ' maxlength="20"') +
    '<div class="two">' + fld('sStart', 'Başlangıç kilosu (kg)', 'number', c.startWeight, ' step="0.1" inputmode="decimal"') + fld('sGoal', 'Hedef kilo (kg)', 'number', c.goalWeight, ' step="0.1" inputmode="decimal"') + '</div>' +
    '<div class="two">' + fld('sDate', 'Başlangıç tarihi', 'date', c.startDate, '') + fld('sRate', 'Hedef tempo (kg/hafta)', 'number', c.rate, ' step="0.1" min="0.2" max="1" inputmode="decimal"') + '</div>' +
    '<div class="three">' + fld('sWater', 'Su hedefi (bardak)', 'number', c.waterGoal, ' step="1" min="4" max="20" inputmode="numeric"') + fld('sKcal', 'Günlük kcal', 'number', c.kcal, ' step="50" min="1200" max="3000" inputmode="numeric"') + daySel + '</div>' +
    '<div class="row"><button type="button" class="btn" id="saveSettings">Kaydet</button><span class="tiny" id="settingsStatus"></span></div>' +
    '<p class="tiny">Güvenli tempo: erkek 0,6–0,8, kadın 0,5 kg/hafta. Kadın için 62 kg bu tempoyla yaklaşık 24 haftada gelir; 3 ay sonunda 67–68 kg ara hedeftir.</p></div>' + cycle +
    '<div class="card"><div class="card-h"><h2>' + esc(c.name) + ' · ödül merdiveni</h2><span class="meta">Simge ve ödül düzenlenebilir</span></div><div>' + ladderRows + '</div>' +
    '<div class="field"><label for="rTh">Başarılı hafta eşiği (puan, 20–75; ikiniz için ortak)</label><input type="number" id="rTh" min="20" max="75" step="5" value="' + state.rewards.threshold + '" inputmode="numeric"></div>' +
    '<div class="row"><button type="button" class="btn ghost" id="saveLadder">Ödülleri kaydet</button><span class="tiny" id="ladderStatus"></span></div>' +
    '<p class="tiny">Puanlar: her öğün 1 (günde 5), su hedefi 2, koşu 1, öğle ve akşam yürüyüşü 1+1, uyku düzeni 1 (yatış en geç 23:15, kalkış en geç 06:30, hafta sonu 07:30) → günde 11; 10 puan alan gün kazanılmış sayılır. Haftalık tartı +5, haftada en çok ' + WEEK_MAX + '. Haftada ' + state.rewards.threshold + ' puan = başarılı hafta; başarılı haftalar birikir (2 hafta, 1 ay = 4, 2 ay = 8, 3 ay = 13, 6 ay = 26). Haftalık ödül her başarılı haftada yenilenir.</p></div>' +
    '<div class="card"><div class="card-h"><h2>Kayıt durumu</h2></div><p>' + (state.mode === 'db' ? 'Paylaşımlı kayıt açık: iki telefonda da aynı veriler görünür.' : state.mode === 'local' ? 'Girdiler yalnızca bu cihazda saklanıyor.' : 'Bağlanıyor…') + '</p>' +
    (STATIC_HOST ? '<div class="note">Bu adreste girdiler telefonun kendi tarayıcı hafızasında tutulur ve iki telefon arasında eşzamanlanmaz. Her kişi kendi telefonundan girsin; tarayıcı verilerini silmek kayıtları siler, arada yedek alın.</div>' : (state.modeNote ? '<p class="tiny">' + esc(state.modeNote) + '</p>' : '') + '<div class="note">İki telefonda ortak takip için aynı Claude hesabıyla açın ya da sayfayı Paylaş menüsünden "Düzenleyici" veya "Katkıda bulunan" olarak e-posta ile davet edin. Yalnızca görüntüleme bağlantısıyla açan kişi veri giremez.</div>') + '</div>' +
    '<div class="card"><div class="card-h"><h2>Yedek</h2><span class="meta">Kopyala, sakla, gerekirse geri yükle</span></div><div class="row"><button type="button" class="btn ghost" id="copyBackup">Yedeği kopyala</button><span class="tiny" id="backupStatus"></span></div><textarea id="backupText" placeholder="Geri yüklemek için yedek metnini buraya yapıştırın" rows="3"></textarea><div class="row"><button type="button" class="btn ghost" id="restoreBackup">Yedeği geri yükle</button></div><p class="tiny">Yedek iki kişinin tüm kayıtlarını, ödülleri, tarif puanlarını ve ayarları içerir. Başka telefona taşımak için orada geri yükleyin; aynı günün daha yeni kaydı korunur.</p></div>';
}
function bindSettings() {
  $('#view-ayarlar').addEventListener('click', async e => {
    const p = state.person, c = cfg(p);
    const numv = (id, fb, lo, hi) => { const v = parseFloat(String($(id).value).replace(',', '.')); return isFinite(v) && v >= lo && v <= hi ? v : fb; };
    if (e.target.closest('#saveSettings')) {
      const s = Object.assign({}, c, { name: ($('#sName').value.trim() || c.name).slice(0, 20), startWeight: numv('#sStart', c.startWeight, 30, 250), goalWeight: numv('#sGoal', c.goalWeight, 30, 250), startDate: isDate($('#sDate').value) ? $('#sDate').value : c.startDate, rate: numv('#sRate', c.rate, 0.2, 1), waterGoal: Math.round(numv('#sWater', c.waterGoal, 4, 20)), kcal: Math.round(numv('#sKcal', c.kcal, 1200, 3000)), weighDay: Number($('#sWeigh').value) });
      if (s.goalWeight >= s.startWeight) { $('#settingsStatus').textContent = 'Hedef kilo başlangıçtan küçük olmalı.'; return; }
      await saveSettings(p, s); renderToday(); $('#settingsStatus').textContent = 'Kaydedildi ' + nowHM(); return;
    }
    if (e.target.closest('#saveCycle')) { const s = Object.assign({}, c, { cycleStart: isDate($('#sCycleStart').value) && $('#sCycleStart').value <= state.today ? $('#sCycleStart').value : '', cycleLen: Math.round(numv('#sCycleLen', c.cycleLen, 20, 45)), periodLen: Math.round(numv('#sPeriodLen', c.periodLen, 2, 10)) }); await saveSettings('K', s); $('#cycleStatus').textContent = 'Kaydedildi ' + nowHM(); return; }
    if (e.target.closest('#saveLadder')) { state.rewards.ladder[p] = RUNG_WEEKS.map((w, i) => ({ weeks: w, icon: ($('#li' + w).value.trim() || LADDER_DEFAULT[p][i].icon).slice(0, 4), title: ($('#lw' + w).value.trim() || LADDER_DEFAULT[p][i].title).slice(0, 80) })); state.rewards.threshold = Math.round(numv('#rTh', state.rewards.threshold, 20, 75)); await saveRewards(); renderSettings(); $('#ladderStatus').textContent = 'Kaydedildi ' + nowHM(); return; }
    if (e.target.closest('#copyBackup')) { const json = backupJson(), ta = $('#backupText'), st = $('#backupStatus'); ta.value = json; try { await navigator.clipboard.writeText(json); st.textContent = 'Panoya kopyalandı ' + nowHM(); } catch (err) { ta.focus(); ta.select(); st.textContent = 'Metin seçildi; basılı tutup Kopyala deyin.'; } return; }
    if (e.target.closest('#restoreBackup')) { const st = $('#backupStatus'), txt = $('#backupText').value.trim(); if (!txt) { st.textContent = 'Önce yedek metnini yapıştırın.'; return; } st.textContent = 'Geri yükleniyor…'; const msg = await restoreBackup(txt); const st2 = $('#backupStatus'); if (st2) st2.textContent = msg; }
  });
}

// ---------- shell: tabs (in-page views) ----------
const TABS = { bugun: { view: 'view-bugun', render: null }, menu: { view: 'view-program', render: renderProgram }, tarifler: { view: 'view-tarifler', render: renderRecipes }, ayarlar: { view: 'view-ayarlar', render: renderSettings } };
function focusedInput() { const a = document.activeElement; return !!(a && a.closest && a.closest('#view-bugun') && /^(INPUT|TEXTAREA)$/.test(a.tagName)); }
function renderTab() {
  Object.keys(TABS).forEach(t => { $('#' + TABS[t].view).hidden = state.tab !== t; $('#tab-' + t).classList.toggle('on', state.tab === t); });
  if (state.tab === 'bugun') { if (!focusedInput()) renderToday(); return; }
  const a = document.activeElement;
  if (a && a.closest && a.closest('#' + TABS[state.tab].view) && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
  TABS[state.tab].render();
}
function renderAll() { renderTab(); }
function setTab(t) { if (!TABS[t]) t = 'bugun'; state.tab = t; if (location.hash.replace('#', '') !== t) { try { location.hash = t; } catch (e) {} } renderTab(); window.scrollTo(0, 0); }
function refreshNext() {
  const t = todayStr();
  if (state.today !== t) { if (state.date === state.today) state.date = t; state.today = t; if (state.tab === 'bugun' && !focusedInput()) renderToday(); return; }
  if (state.tab === 'bugun' && state.date === t && !focusedInput()) renderToday();
}
function openRecipe(id) {
  if (!RECIPES.find(r => r.id === id)) return;
  state.open.add('rec-' + id); lsSet('bt_open', Array.from(state.open));
  setTab('tarifler');
  const d = document.getElementById('rec-' + id); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
function boot() {
  state.open = new Set(lsGet('bt_open', []) || []);
  document.addEventListener('click', e => { const r = e.target.closest('[data-recipe]'); if (r) { e.preventDefault(); e.stopPropagation(); openRecipe(r.dataset.recipe); } }, true);
  document.addEventListener('toggle', e => {
    const el = e.target; if (!el || el.tagName !== 'DETAILS' || !el.id) return;
    if (el.open) state.open.add(el.id); else state.open.delete(el.id);
    lsSet('bt_open', Array.from(state.open));
  }, true);
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  window.addEventListener('hashchange', () => { const t = location.hash.replace('#', ''); if (t !== state.tab) setTab(t); });
  const h = location.hash.replace('#', ''); state.tab = TABS[h] ? h : 'bugun';
  bindToday(); bindRecipes(); bindSettings();
  setInterval(refreshNext, 60000);
  connect();
}
boot();
</script>
