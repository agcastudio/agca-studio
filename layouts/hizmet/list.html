{{ define "main" }}
<section class="wrap page-head">
  <h1 class="page-title">{{ .Title }}</h1>
  {{- with .Params.lede }}<p class="lede">{{ . | markdownify }}</p>{{ end }}
</section>
<section class="wrap services">
  <ul class="service-list">
    {{- range .Pages.ByWeight }}
    <li class="service">
      <a href="{{ .RelPermalink }}">
        <h2 class="service-title">{{ .Title }}</h2>
        <p class="service-lede">{{ .Params.lede | markdownify }}</p>
        <span class="more">{{ i18n "read_more" }} →</span>
      </a>
    </li>
    {{- end }}
  </ul>
  {{- with .Content }}<div class="prose services-text">{{ . }}</div>{{ end }}
</section>
{{ end }}
