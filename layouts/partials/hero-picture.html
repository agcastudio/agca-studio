{{- /* Kapak <picture>: geniş ekranda 3:2 kırpım, dar ekranda özgün oran. Parametreler: hero (dict), alt */ -}}
{{- $h := .hero -}}
<picture>
  {{- with $h.srcsetWide }}
  <source type="image/webp" media="(min-width: 900px)" srcset="{{ . }}" sizes="100vw">
  {{- end }}
  <source type="image/webp" srcset="{{ $h.srcset }}" sizes="100vw">
  <img src="{{ $h.fallback.RelPermalink }}" width="{{ $h.fallback.Width }}" height="{{ $h.fallback.Height }}" alt="{{ .alt }}" fetchpriority="high">
</picture>
