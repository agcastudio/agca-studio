{{- $js := resources.Get "js/site.js" | resources.Minify | resources.Fingerprint }}
{{- if and (eq .Type "proje") (not .IsSection) }}
<link rel="stylesheet" href="/vendor/glightbox/glightbox.min.css">
<script src="/vendor/glightbox/glightbox.min.js" defer></script>
{{- end }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{- with site.Params.cfAnalyticsToken }}
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ . }}"}'></script>
{{- end }}
