<!DOCTYPE html>
<html lang="{{ .Language.Lang }}" dir="ltr">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ end }} kind-{{ .Kind }}{{ with .Type }} type-{{ . }}{{ end }}">
<a class="skip" href="#icerik">{{ i18n "skip_to_content" }}</a>
{{ partial "header.html" . }}
<main id="icerik" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ partial "scripts.html" . }}
</body>
</html>
